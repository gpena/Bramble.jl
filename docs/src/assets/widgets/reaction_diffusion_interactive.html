<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff;
    --text: #2c2c2c;
    --muted: #6b6b6b;
    --border: #d8d8d4;
    --canvas-bg: #fafaf8;
    --accent: #0e7c86;
    --accent2: #b1443e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --text: #dcdcd6;
      --muted: #9a9a94;
      --border: #3a3a36;
      --canvas-bg: #262624;
      --accent: #4fd1c5;
      --accent2: #e8837c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin-bottom: 12px;
  }
  .field { display: flex; flex-direction: column; gap: 2px; min-width: 110px; }
  .field.wide { min-width: 160px; }
  label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  select, input[type="range"] { font: inherit; color: var(--text); background: var(--canvas-bg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 4px; }
  input[type="range"] { padding: 0; accent-color: var(--accent); }
  .range-row { display: flex; align-items: center; gap: 8px; }
  .range-row span { font-variant-numeric: tabular-nums; min-width: 2.6em; }
  .hidden { display: none !important; }
  .canvases { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 8px; }
  .panel { display: flex; flex-direction: column; gap: 4px; }
  .panel-title { font-size: 11px; color: var(--muted); }
  canvas { border: 1px solid var(--border); border-radius: 4px; background: var(--canvas-bg); display: block; }
  #cursorReadout { font-size: 11px; color: var(--muted); margin-bottom: 10px; min-height: 1.4em; font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 2px 12px 2px 0; }
  th { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>

<div class="controls">
  <div class="field wide">
    <label for="nRange">Resolution N</label>
    <div class="range-row">
      <input type="range" id="nRange" min="8" max="28" step="1" value="16">
      <span id="nLabel">16</span>
    </div>
  </div>
  <div class="field">
    <label for="meshType">Mesh</label>
    <select id="meshType">
      <option value="uniform" selected>Uniform</option>
      <option value="random">Random</option>
    </select>
  </div>
  <div class="field wide">
    <label for="aRange">Reaction a (u)</label>
    <div class="range-row">
      <input type="range" id="aRange" min="0.2" max="3" step="0.1" value="1">
      <span id="aLabel">1.0</span>
    </div>
  </div>
  <div class="field wide">
    <label for="bRange">Reaction b (v)</label>
    <div class="range-row">
      <input type="range" id="bRange" min="0.2" max="3" step="0.1" value="1">
      <span id="bLabel">1.0</span>
    </div>
  </div>
  <div class="field wide">
    <label for="gammaRange">Coupling &gamma;</label>
    <div class="range-row">
      <input type="range" id="gammaRange" min="0" max="2" step="0.1" value="1">
      <span id="gammaLabel">1.0</span>
    </div>
  </div>
  <div class="field wide">
    <label for="ratioRange">D&#x1D64;/D&#x1D65;</label>
    <div class="range-row">
      <input type="range" id="ratioRange" min="0.2" max="5" step="0.1" value="1">
      <span id="ratioLabel">1.0</span>
    </div>
  </div>
  <div class="field">
    <label for="colormapSel">Colormap</label>
    <select id="colormapSel">
      <option value="viridis" selected>Viridis</option>
      <option value="plasma">Plasma</option>
      <option value="turbo">Turbo</option>
      <option value="gray">Grayscale</option>
    </select>
  </div>
  <div class="field wide">
    <label for="panel2Sel">Bottom panel</label>
    <select id="panel2Sel">
      <option value="spy" selected>Jacobian block sparsity</option>
      <option value="cross">Cross-section profile</option>
      <option value="mesh">Mesh nodes</option>
    </select>
  </div>
  <div class="field" id="crossAxisField">
    <label for="crossAxisSel">Slice</label>
    <select id="crossAxisSel">
      <option value="x" selected>Along x (fixed y)</option>
      <option value="y">Along y (fixed x)</option>
    </select>
  </div>
  <div class="field wide" id="crossPosField">
    <label for="crossPosRange">Slice position</label>
    <div class="range-row">
      <input type="range" id="crossPosRange" min="0" max="1" step="0.01" value="0.5">
      <span id="crossPosLabel">0.50</span>
    </div>
  </div>
</div>

<div class="canvases">
  <div class="panel">
    <span class="panel-title">u&#x2095;(x, y) — activator</span>
    <canvas id="fieldUCanvas" width="230" height="230"></canvas>
  </div>
  <div class="panel">
    <span class="panel-title">v&#x2095;(x, y) — inhibitor</span>
    <canvas id="fieldVCanvas" width="230" height="230"></canvas>
  </div>
  <div class="panel">
    <span class="panel-title" id="panel2Title">Jacobian block sparsity</span>
    <canvas id="panel2Canvas" width="230" height="230"></canvas>
  </div>
</div>

<div id="cursorReadout">Hover a heatmap to read (x, y, u&#x2095;, v&#x2095;).</div>

<table id="diagTable">
  <tr><th>Degrees of freedom</th><td id="diagDof"></td>
      <th>Picard iterations</th><td id="diagIters"></td>
      <th>Final update</th><td id="diagResidual"></td></tr>
  <tr><th>norm&#x2095;(u&#x2095; - u)</th><td id="diagL2U"></td>
      <th>norm&#x2081;&#x2095;(u&#x2095; - u)</th><td id="diagH1U"></td></tr>
  <tr><th>norm&#x2095;(v&#x2095; - v)</th><td id="diagL2V"></td>
      <th>norm&#x2081;&#x2095;(v&#x2095; - v)</th><td id="diagH1V"></td></tr>
</table>

<script>
(function () {
  "use strict";

  // Same deterministic PRNG and non-uniform axis builder as poisson_interactive.html --
  // kept byte-identical so the two widgets draw the same family of meshes for the same
  // (N, mesh type) pair.
  function mulberry32(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function buildAxis(N, random, seed) {
    var x = new Float64Array(N + 1);
    for (var i = 0; i <= N; i++) x[i] = i / N;
    if (!random) return x;

    var rand = mulberry32(seed);
    var h = 1 / N;
    for (i = 1; i < N; i++) x[i] = rand();
    x = Array.prototype.slice.call(x).sort(function (a, b) { return a - b; });

    var minGap = 0.15 * h;
    for (i = 1; i < N; i++) {
      if (x[i] - x[i - 1] < minGap) x[i] = x[i - 1] + minGap;
    }
    var span = x[N] === x[0] ? 1 : (1 - x[0]) / (x[N] - x[0]);
    for (i = 0; i <= N; i++) x[i] = x[0] + (x[i] - x[0]) * span;
    x[0] = 0;
    x[N] = 1;
    return Float64Array.from(x);
  }

  // Manufactured solution fixed to the same pair the worked example uses
  // (docs/src/examples/coupled_reaction_diffusion.jl): u_ex = sin(pi x) sin(pi y),
  // v_ex = sin(2 pi x) sin(2 pi y), both vanishing on the boundary, so Dirichlet data is
  // zero and the flux-based right-hand side below never needs a boundary correction term.
  // Both are eigenfunctions of -Delta on the unit square (eigenvalues 2 pi^2 and 8 pi^2
  // respectively), which is what lets the source terms below be written in closed form for
  // any (a, b, gamma, D_u/D_v) instead of only the a = b = gamma = D_u/D_v = 1 case the
  // static example fixes.
  function uExact(x, y) { return Math.sin(Math.PI * x) * Math.sin(Math.PI * y); }
  function vExact(x, y) { return Math.sin(2 * Math.PI * x) * Math.sin(2 * Math.PI * y); }
  function source1(x, y, a, gamma, Du) {
    var u = uExact(x, y), v = vExact(x, y);
    return Du * 2 * Math.PI * Math.PI * u + a * u + gamma * u * v;
  }
  function source2(x, y, b, gamma, Dv) {
    var u = uExact(x, y), v = vExact(x, y);
    return Dv * 8 * Math.PI * Math.PI * v - gamma * u * v + b * v;
  }

  // Mesh geometry and the 5-point finite-volume flux coefficients, shared by both species
  // since -Delta u and -Delta v are discretised on the same mesh -- only the diffusion
  // scale D and the reaction diagonal differ per block (assembled separately below).
  // `pattern` is the diagonal-block sparsity (neighbour + self pairs), reused verbatim for
  // both A_uu and A_vv in the spy plot since they share this same stencil.
  function buildMesh(N, X, Y) {
    var m = N - 1;
    var dof = m * m;
    var idx = function (k, l) { return l * m + k; };

    var hxm = new Float64Array(m), hxp = new Float64Array(m);
    var hym = new Float64Array(m), hyp = new Float64Array(m);
    for (var k = 0; k < m; k++) { hxm[k] = X[k + 1] - X[k]; hxp[k] = X[k + 2] - X[k + 1]; }
    for (var l = 0; l < m; l++) { hym[l] = Y[l + 1] - Y[l]; hyp[l] = Y[l + 2] - Y[l + 1]; }

    var cW = new Float64Array(dof), cE = new Float64Array(dof);
    var cS = new Float64Array(dof), cN = new Float64Array(dof);
    var cellVol = new Float64Array(dof);
    var pattern = [];
    for (l = 0; l < m; l++) {
      for (k = 0; k < m; k++) {
        var faceY = 0.5 * (hym[l] + hyp[l]), faceX = 0.5 * (hxm[k] + hxp[k]);
        var row = idx(k, l);
        cW[row] = faceY / hxm[k]; cE[row] = faceY / hxp[k];
        cS[row] = faceX / hym[l]; cN[row] = faceX / hyp[l];
        cellVol[row] = faceX * faceY;
        if (k > 0) pattern.push([row, idx(k - 1, l)]);
        if (k < m - 1) pattern.push([row, idx(k + 1, l)]);
        if (l > 0) pattern.push([row, idx(k, l - 1)]);
        if (l < m - 1) pattern.push([row, idx(k, l + 1)]);
        pattern.push([row, row]);
      }
    }
    return { m: m, dof: dof, idx: idx, cW: cW, cE: cE, cS: cS, cN: cN, cellVol: cellVol, pattern: pattern };
  }

  // Matrix-free operator for one block: D * (-Delta) + diag(diagArr). `diagArr` carries the
  // raw reaction coefficient (a or b) plus the frozen coupling term (gamma * other field);
  // it is weighted here by the same nodal cell measure the flux balance and the right-hand
  // side already use (`mesh.cellVol`), since innerₕ -- what the reaction terms assemble
  // through in coupled_reaction_diffusion.jl's `coupled_matrix` -- is that cell-measure-
  // weighted inner product, not a bare pointwise product.
  function makeMatvec(mesh, D, diagArr) {
    var m = mesh.m, cW = mesh.cW, cE = mesh.cE, cS = mesh.cS, cN = mesh.cN;
    var cellVol = mesh.cellVol, idx = mesh.idx;
    return function (v, out) {
      for (var l = 0; l < m; l++) {
        for (var k = 0; k < m; k++) {
          var r = idx(k, l);
          var s = D * (cW[r] + cE[r] + cS[r] + cN[r]) * v[r] + diagArr[r] * cellVol[r] * v[r];
          if (k > 0) s -= D * cW[r] * v[idx(k - 1, l)];
          if (k < m - 1) s -= D * cE[r] * v[idx(k + 1, l)];
          if (l > 0) s -= D * cS[r] * v[idx(k, l - 1)];
          if (l < m - 1) s -= D * cN[r] * v[idx(k, l + 1)];
          out[r] = s;
        }
      }
    };
  }

  function dot(a, b) {
    var s = 0;
    for (var i = 0; i < a.length; i++) s += a[i] * b[i];
    return s;
  }
  function norm2(a) { return Math.sqrt(dot(a, a)); }

  // Unpreconditioned BiCGStab rather than CG: the reaction diagonal a + gamma * v (or
  // b - gamma * u) is frozen at the *other* field's current Picard iterate, which need not
  // stay positive across the parameter sliders' full range, so the block is not guaranteed
  // symmetric positive definite the way the pure Laplacian block in poisson_interactive.html
  // is -- BiCGStab only needs the operator nonsingular.
  function bicgstab(dof, matvec, b, maxIter, tol) {
    var x = new Float64Array(dof);
    var r = b.slice();
    var rhat = r.slice();
    var bnorm = norm2(b) || 1;
    var rho = 1, alpha = 1, omega = 1;
    var v = new Float64Array(dof), p = new Float64Array(dof);
    var s = new Float64Array(dof), t = new Float64Array(dof);
    var rhoPrev;

    for (var iter = 0; iter < maxIter; iter++) {
      rhoPrev = rho;
      rho = dot(rhat, r);
      if (rho === 0) break;
      if (iter === 0) {
        p.set(r);
      } else {
        var beta = (rho / rhoPrev) * (alpha / omega);
        for (var i = 0; i < dof; i++) p[i] = r[i] + beta * (p[i] - omega * v[i]);
      }
      matvec(p, v);
      alpha = rho / dot(rhat, v);
      for (i = 0; i < dof; i++) s[i] = r[i] - alpha * v[i];
      if (norm2(s) < tol * bnorm) {
        for (i = 0; i < dof; i++) x[i] += alpha * p[i];
        break;
      }
      matvec(s, t);
      var tt = dot(t, t);
      omega = tt === 0 ? 0 : dot(t, s) / tt;
      for (i = 0; i < dof; i++) { x[i] += alpha * p[i] + omega * s[i]; r[i] = s[i] - omega * t[i]; }
      if (norm2(r) < tol * bnorm) break;
      if (omega === 0) break;
    }
    return x;
  }

  var COLORMAPS = {
    viridis: ["#440154", "#414487", "#2a788e", "#22a884", "#7ad151", "#fde725"],
    plasma: ["#0d0887", "#6a00a8", "#b12a90", "#e16462", "#fca636", "#f0f921"],
    turbo: ["#30123b", "#4147d6", "#1ba8c9", "#61c93a", "#ecd21a", "#e4460a", "#7a0403"],
    gray: ["#000000", "#ffffff"],
  };
  function hexToRgb(h) {
    var v = parseInt(h.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  function colormapFn(name) {
    var stops = COLORMAPS[name].map(hexToRgb);
    return function (t) {
      t = Math.max(0, Math.min(1, t));
      var pos = t * (stops.length - 1);
      var i0 = Math.floor(pos), i1 = Math.min(i0 + 1, stops.length - 1);
      var f = pos - i0, a = stops[i0], b = stops[i1];
      return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
    };
  }

  // Renders into an offscreen (N+1)x(N+1) canvas kept around in `state` so a mousemove can
  // redraw the crosshair on top without recomputing the field itself.
  function renderField(canvas, N, values, cmap) {
    var min = Infinity, max = -Infinity;
    for (var i = 0; i < values.length; i++) { if (values[i] < min) min = values[i]; if (values[i] > max) max = values[i]; }
    var range = max - min || 1;

    var off = document.createElement("canvas");
    off.width = N + 1; off.height = N + 1;
    var octx = off.getContext("2d");
    var img = octx.createImageData(N + 1, N + 1);
    for (var j = 0; j <= N; j++) {
      var srcRow = N - j;
      for (i = 0; i <= N; i++) {
        var t = (values[srcRow * (N + 1) + i] - min) / range;
        var rgb = cmap(t);
        var p = (j * (N + 1) + i) * 4;
        img.data[p] = rgb[0]; img.data[p + 1] = rgb[1]; img.data[p + 2] = rgb[2]; img.data[p + 3] = 255;
      }
    }
    octx.putImageData(img, 0, 0);
    drawBase(canvas, off);
    return off;
  }

  function drawBase(canvas, off) {
    var ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
  }

  function drawCrosshair(canvas, off, N, i, j) {
    drawBase(canvas, off);
    var ctx = canvas.getContext("2d");
    var px = (i / N) * canvas.width, py = (1 - j / N) * canvas.height;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py, 5, 0, 2 * Math.PI); ctx.stroke();
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(px, py, 5, 0, 2 * Math.PI); ctx.stroke();
  }

  // Full 2n x 2n Jacobian sparsity: diagonal blocks A_uu, A_vv reuse the shared Laplacian
  // stencil pattern (offset into the top-left and bottom-right quadrants); the off-diagonal
  // coupling blocks A_uv = d(residual_u)/dv = gamma * u and A_vu = d(residual_v)/du =
  // -gamma * v are diagonal matrices (the reaction term is pointwise -- no derivative
  // spreads it to a neighbouring node), so each contributes exactly one entry per row,
  // present only when gamma != 0.
  function drawBlockSpy(canvas, mesh, gamma) {
    var dof = mesh.dof, dof2 = 2 * dof;
    var ctx = canvas.getContext("2d");
    var bg = getComputedStyle(canvas).backgroundColor;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    var scale = canvas.width / dof2;
    var dotSize = Math.max(1, Math.ceil(scale));

    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent") || "#0e7c86";
    for (var n = 0; n < mesh.pattern.length; n++) {
      var row = mesh.pattern[n][0], col = mesh.pattern[n][1];
      ctx.fillRect(Math.floor(col * scale), Math.floor(row * scale), dotSize, dotSize);
      ctx.fillRect(Math.floor((col + dof) * scale), Math.floor((row + dof) * scale), dotSize, dotSize);
    }
    if (gamma !== 0) {
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent2") || "#b1443e";
      for (var r = 0; r < dof; r++) {
        ctx.fillRect(Math.floor((dof + r) * scale), Math.floor(r * scale), dotSize, dotSize);
        ctx.fillRect(Math.floor(r * scale), Math.floor((dof + r) * scale), dotSize, dotSize);
      }
    }
  }

  function drawMeshNodes(canvas, X, Y) {
    var ctx = canvas.getContext("2d");
    var bg = getComputedStyle(canvas).backgroundColor;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    var margin = 14;
    var w = canvas.width - 2 * margin, h = canvas.height - 2 * margin;
    var toPx = function (x) { return margin + x * w; };
    var toPy = function (y) { return canvas.height - margin - y * h; };

    ctx.strokeStyle = getComputedStyle(canvas).borderColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 0; i < X.length; i++) {
      ctx.moveTo(toPx(X[i]), toPy(Y[0]));
      ctx.lineTo(toPx(X[i]), toPy(Y[Y.length - 1]));
    }
    for (var j = 0; j < Y.length; j++) {
      ctx.moveTo(toPx(X[0]), toPy(Y[j]));
      ctx.lineTo(toPx(X[X.length - 1]), toPy(Y[j]));
    }
    ctx.stroke();

    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent") || "#0e7c86";
    for (i = 0; i < X.length; i++) {
      for (j = 0; j < Y.length; j++) {
        ctx.beginPath();
        ctx.arc(toPx(X[i]), toPy(Y[j]), 1.6, 0, 2 * Math.PI);
        ctx.fill();
      }
    }
  }

  function drawCrossSection(canvas, N, uGrid, vGrid, axis, pos) {
    var ctx = canvas.getContext("2d");
    var bg = getComputedStyle(canvas).backgroundColor;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var fixedIdx = Math.round(pos * N);
    var uLine = new Float64Array(N + 1), vLine = new Float64Array(N + 1);
    for (var s = 0; s <= N; s++) {
      var i = axis === "x" ? s : fixedIdx;
      var j = axis === "x" ? fixedIdx : s;
      uLine[s] = uGrid[j * (N + 1) + i];
      vLine[s] = vGrid[j * (N + 1) + i];
    }

    var min = Math.min.apply(null, uLine), max = Math.max.apply(null, uLine);
    for (s = 0; s <= N; s++) { min = Math.min(min, vLine[s]); max = Math.max(max, vLine[s]); }
    var range = max - min || 1;
    var margin = 14;
    var w = canvas.width - 2 * margin, h = canvas.height - 2 * margin;
    var toPx = function (t) { return margin + (t / N) * w; };
    var toPy = function (val) { return canvas.height - margin - ((val - min) / range) * h; };

    ctx.strokeStyle = getComputedStyle(canvas).borderColor;
    ctx.lineWidth = 1;
    ctx.strokeRect(margin, margin, w, h);

    function drawLine(line, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (var s2 = 0; s2 <= N; s2++) {
        var px = toPx(s2), py = toPy(line[s2]);
        if (s2 === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    drawLine(uLine, getComputedStyle(document.documentElement).getPropertyValue("--accent") || "#0e7c86");
    drawLine(vLine, getComputedStyle(document.documentElement).getPropertyValue("--accent2") || "#b1443e");
  }

  // Same nodal weighting as Bramble's normₕ/norm₁ₕ (src/space/inner_product.jl) used by
  // poisson_interactive.html -- see that file's comment for the derivation.
  function nodalWeights(Z) {
    var N = Z.length - 1;
    var w = new Float64Array(N + 1);
    w[0] = (Z[1] - Z[0]) / 2;
    w[N] = (Z[N] - Z[N - 1]) / 2;
    for (var i = 1; i < N; i++) w[i] = (Z[i + 1] - Z[i - 1]) / 2;
    return w;
  }
  function fieldErrors(N, X, Y, grid, exact) {
    var wx = nodalWeights(X), wy = nodalWeights(Y);
    var normhSq = 0;
    var errGrid = new Float64Array((N + 1) * (N + 1));
    for (var j = 0; j <= N; j++) {
      for (var i = 0; i <= N; i++) {
        var e = grid[j * (N + 1) + i] - exact(X[i], Y[j]);
        errGrid[j * (N + 1) + i] = e;
        normhSq += wx[i] * wy[j] * e * e;
      }
    }
    var seminormSq = 0;
    for (j = 0; j <= N; j++) {
      for (i = 0; i < N; i++) {
        var dx = X[i + 1] - X[i];
        var de = errGrid[j * (N + 1) + i + 1] - errGrid[j * (N + 1) + i];
        seminormSq += wy[j] * (de / dx) * (de / dx) * dx;
      }
    }
    for (j = 0; j < N; j++) {
      var dy = Y[j + 1] - Y[j];
      for (i = 0; i <= N; i++) {
        var de2 = errGrid[(j + 1) * (N + 1) + i] - errGrid[j * (N + 1) + i];
        seminormSq += wx[i] * (de2 / dy) * (de2 / dy) * dy;
      }
    }
    return { normh: Math.sqrt(normhSq), norm1h: Math.sqrt(normhSq + seminormSq) };
  }

  function fmt(x) {
    if (!isFinite(x)) return "--";
    return x.toExponential(3);
  }

  var state = { N: 0, X: null, Y: null, uGrid: null, vGrid: null, offU: null, offV: null };

  function recompute() {
    var N = parseInt(document.getElementById("nRange").value, 10);
    document.getElementById("nLabel").textContent = N;
    var random = document.getElementById("meshType").value === "random";
    var a = parseFloat(document.getElementById("aRange").value);
    var b = parseFloat(document.getElementById("bRange").value);
    var gamma = parseFloat(document.getElementById("gammaRange").value);
    var ratio = parseFloat(document.getElementById("ratioRange").value);
    document.getElementById("aLabel").textContent = a.toFixed(1);
    document.getElementById("bLabel").textContent = b.toFixed(1);
    document.getElementById("gammaLabel").textContent = gamma.toFixed(1);
    document.getElementById("ratioLabel").textContent = ratio.toFixed(1);
    var cmap = colormapFn(document.getElementById("colormapSel").value);
    var panel2 = document.getElementById("panel2Sel").value;

    var Dv = 1, Du = ratio; // D_v fixed at 1; the slider sets the ratio D_u / D_v directly.

    // Same per-(N, mesh type) seeding rationale as poisson_interactive.html: without mixing
    // N into the seed every resolution would replay the same PRNG prefix.
    var X = buildAxis(N, random, 20260916 + N * 7919);
    var Y = buildAxis(N, random, 20260917 + N * 7919);
    var mesh = buildMesh(N, X, Y);
    var m = mesh.m, dof = mesh.dof, idx = mesh.idx;

    var f1b = new Float64Array(dof), f2b = new Float64Array(dof);
    for (var l = 0; l < m; l++) {
      for (var k = 0; k < m; k++) {
        var row = idx(k, l), ii = k + 1, jj = l + 1;
        f1b[row] = source1(X[ii], Y[jj], a, gamma, Du) * mesh.cellVol[row];
        f2b[row] = source2(X[ii], Y[jj], b, gamma, Dv) * mesh.cellVol[row];
      }
    }

    // Block Gauss-Seidel Picard iteration: freeze the *other* field's current iterate inside
    // each block's reaction diagonal, solve the two decoupled linear systems, repeat. This
    // is the same linearisation coupled_reaction_diffusion.jl's `coupled_matrix` uses for its
    // hand-written Newton loop (v_c/u_c frozen coefficients), just iterated to convergence
    // here instead of driven by an outer Newton step, since this widget solves each block
    // matrix-free rather than forming and factoring the full sparse Jacobian in JavaScript.
    // Under-relaxation (0.7) keeps the sweep stable across the full slider range, including
    // combinations where the frozen diagonal briefly loses definiteness.
    var uGuess = new Float64Array(dof), vGuess = new Float64Array(dof);
    var bicgMax = Math.min(6 * dof, 800);
    var relax = 0.7, maxPicard = 30, tol = 1e-7;
    var iterUsed = 0, residual = Infinity;
    for (var iter = 0; iter < maxPicard; iter++) {
      var diagU = new Float64Array(dof);
      for (var r = 0; r < dof; r++) diagU[r] = a + gamma * vGuess[r];
      var uNew = bicgstab(dof, makeMatvec(mesh, Du, diagU), f1b, bicgMax, 1e-9);
      for (r = 0; r < dof; r++) uNew[r] = uGuess[r] + relax * (uNew[r] - uGuess[r]);

      var diagV = new Float64Array(dof);
      for (r = 0; r < dof; r++) diagV[r] = b - gamma * uNew[r];
      var vNew = bicgstab(dof, makeMatvec(mesh, Dv, diagV), f2b, bicgMax, 1e-9);
      for (r = 0; r < dof; r++) vNew[r] = vGuess[r] + relax * (vNew[r] - vGuess[r]);

      var change = 0;
      for (r = 0; r < dof; r++) {
        change = Math.max(change, Math.abs(uNew[r] - uGuess[r]), Math.abs(vNew[r] - vGuess[r]));
      }
      uGuess = uNew; vGuess = vNew;
      iterUsed = iter + 1;
      residual = change;
      if (change < tol) break;
    }

    var uGrid = new Float64Array((N + 1) * (N + 1));
    var vGrid = new Float64Array((N + 1) * (N + 1));
    for (var j = 0; j <= N; j++) {
      for (var i = 0; i <= N; i++) {
        var interior = i > 0 && i < N && j > 0 && j < N;
        uGrid[j * (N + 1) + i] = interior ? uGuess[(j - 1) * m + (i - 1)] : 0;
        vGrid[j * (N + 1) + i] = interior ? vGuess[(j - 1) * m + (i - 1)] : 0;
      }
    }

    state.N = N; state.X = X; state.Y = Y; state.uGrid = uGrid; state.vGrid = vGrid;
    state.offU = renderField(document.getElementById("fieldUCanvas"), N, uGrid, cmap);
    state.offV = renderField(document.getElementById("fieldVCanvas"), N, vGrid, cmap);

    var panel2Canvas = document.getElementById("panel2Canvas");
    if (panel2 === "spy") {
      document.getElementById("panel2Title").textContent = "Jacobian block sparsity";
      drawBlockSpy(panel2Canvas, mesh, gamma);
    } else if (panel2 === "cross") {
      document.getElementById("panel2Title").textContent = "Cross-section profile";
      var axis = document.getElementById("crossAxisSel").value;
      var pos = parseFloat(document.getElementById("crossPosRange").value);
      drawCrossSection(panel2Canvas, N, uGrid, vGrid, axis, pos);
    } else {
      document.getElementById("panel2Title").textContent = "Mesh nodes";
      drawMeshNodes(panel2Canvas, X, Y);
    }

    var errU = fieldErrors(N, X, Y, uGrid, uExact);
    var errV = fieldErrors(N, X, Y, vGrid, vExact);
    document.getElementById("diagDof").textContent = 2 * dof;
    document.getElementById("diagIters").textContent = iterUsed;
    document.getElementById("diagResidual").textContent = fmt(residual);
    document.getElementById("diagL2U").textContent = fmt(errU.normh);
    document.getElementById("diagH1U").textContent = fmt(errU.norm1h);
    document.getElementById("diagL2V").textContent = fmt(errV.normh);
    document.getElementById("diagH1V").textContent = fmt(errV.norm1h);
  }

  function updatePanel2Visibility() {
    var isCross = document.getElementById("panel2Sel").value === "cross";
    document.getElementById("crossAxisField").classList.toggle("hidden", !isCross);
    document.getElementById("crossPosField").classList.toggle("hidden", !isCross);
  }

  // Linked cursor: hovering either heatmap reads the same (i, j) node on both, since they
  // share one mesh -- the crosshair and the readout below always describe one physical point.
  function attachLinkedCursor() {
    var uCanvas = document.getElementById("fieldUCanvas");
    var vCanvas = document.getElementById("fieldVCanvas");

    function handleMove(evt, canvas) {
      if (!state.X) return;
      var rect = canvas.getBoundingClientRect();
      var px = (evt.clientX - rect.left) / rect.width * canvas.width;
      var py = (evt.clientY - rect.top) / rect.height * canvas.height;
      var N = state.N;
      var i = Math.max(0, Math.min(N, Math.round((px / canvas.width) * N)));
      var j = Math.max(0, Math.min(N, Math.round(N - (py / canvas.height) * N)));
      drawCrosshair(uCanvas, state.offU, N, i, j);
      drawCrosshair(vCanvas, state.offV, N, i, j);
      var u = state.uGrid[j * (N + 1) + i], v = state.vGrid[j * (N + 1) + i];
      document.getElementById("cursorReadout").textContent =
        "x = " + state.X[i].toFixed(3) + ", y = " + state.Y[j].toFixed(3) +
        ", uₕ = " + u.toExponential(3) + ", vₕ = " + v.toExponential(3);
    }
    function handleLeave() {
      if (!state.offU) return;
      drawBase(uCanvas, state.offU);
      drawBase(vCanvas, state.offV);
    }
    [uCanvas, vCanvas].forEach(function (c) {
      c.addEventListener("mousemove", function (evt) { handleMove(evt, c); });
      c.addEventListener("mouseleave", handleLeave);
    });
  }

  ["nRange", "meshType", "aRange", "bRange", "gammaRange", "ratioRange", "colormapSel",
   "crossAxisSel", "crossPosRange"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", recompute);
  });
  document.getElementById("panel2Sel").addEventListener("input", function () {
    updatePanel2Visibility();
    recompute();
  });
  document.getElementById("crossPosRange").addEventListener("input", function () {
    document.getElementById("crossPosLabel").textContent = parseFloat(this.value).toFixed(2);
  });

  attachLinkedCursor();
  updatePanel2Visibility();
  if (window.__BRAMBLE_INITIAL_N__) document.getElementById("nRange").value = window.__BRAMBLE_INITIAL_N__;
  recompute();
})();
</script>
</body>
