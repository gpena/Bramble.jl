name: Nightly

# Everything the per-push CI.yml deliberately leaves off, once a day: Linux entirely, and the
# checks that are not canaries but don't need every-push feedback either.
#
# CI.yml's push gate is macOS-only, and runs the `unit` group. Linux lives here, in the
# `slow` job below, on the same released Julia 1.13 — a second platform on the gate doubles
# the runner time for a leg that agrees with the first one almost always, and when it does
# not, the disagreement has historically been a Linux-only allocation flake in `avgₕ!`
# (test/space/vector_elements.jl's "allocations do not grow with the grid" — an
# architecture-dependent `@generated` fold, documented there, not a real regression each time
# it fires) rather than a break. That same job runs the `slow` group, which is `unit` plus
# the blocks whose cost is out of proportion to what a *push* learns from them; see
# test/TestUtils.jl's `WITH_SLOW_TESTS` for the list and the measurement. The worked-example
# pages are not in `slow` any more: they are the `examples` group, which docs-on-demand.yml
# runs before every docs build. AD and GPU tests are off in every group until v4.3.0 and
# v4.4.0 respectively (test/TestUtils.jl, `WITH_AD_TESTS` and `WITH_GPU_TESTS`); each comes
# back by setting `BRAMBLE_TEST_AD` or `BRAMBLE_TEST_GPU` in a job's env here and adding its
# packages. Julia nightly
# changes underneath every push regardless of what Bramble does, so gating on it meant the
# same kind of unrelated red gate. Formatting and quality (Aqua & JET) are
# not canaries in that sense, but moving them off every push trades same-push feedback for a
# leaner, faster push CI — a failure here is caught and fixed the same day rather than the
# same minute.
#
# Docs are not built here: `docs-on-demand.yml` owns them, and it deploys on a release tag
# or on demand -- never on a schedule, and never bundled into an unrelated full-matrix run.
#
# 06:00 UTC, after CompatHelper's 00:00 run, for the same reason Weekly.yml picks its own
# time after CompatHelper: a compat bump it opens has already landed or not by the time this
# decides what to install.
#
# `test` runs Julia nightly on both platforms, and is switched off (`if: false`) while the
# 1.14 dev series breaks upstream packages Bramble tests against: GPUCompiler and Mooncake fail
# to precompile (`WorldView` not defined in `Compiler`), JET refuses to run, and SparseArrays'
# `lu` recurses without end on a `Dual` matrix. Delete the `if:` to bring it back.

permissions:
  contents: read

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  JULIA_NUM_THREADS: auto

jobs:
  # A scheduled run on the same `main` commit as the last successful scheduled run would
  # repeat it exactly, so it stops here. A manual dispatch always runs.
  changed:
    name: New commits since the last green nightly
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?branch=main&event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "${{ github.sha }}" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  # The released Julia that CI.yml gates on, on both platforms, plus everything CI.yml
  # leaves off the gate for cost. CI.yml runs `unit` on macOS only, to keep a push's
  # feedback short; this runs `slow`, which is `unit` plus the deferred blocks
  # (test/TestUtils.jl's `WITH_SLOW_TESTS` names them, with what each one costs). One job
  # therefore covers both the Linux platform check and the deferred blocks, and covers them
  # on macOS too, so a block that moved off the gate is not thereby moved off macOS.
  #
  # It gates — no `continue-on-error` — because, unlike the `test` job below, it runs a
  # released compiler over Bramble's own code: a red leg here is Bramble's, not upstream's.
  #
  # Keep the version in step with CI.yml's matrix. The point of the ubuntu leg is that the
  # two platforms run the same thing; a drift makes it a different question.
  #
  # The ubuntu leg also uploads the `slow` half of the coverage, to Codecov (flag `suite`)
  # and as the `lcov-suite` artifact that Weekly.yml's per-file coverage floor merges with
  # its `backends` half. id-token: write is for the codecov-action's `use_oidc: true`;
  # Weekly.yml's `full` job explains why the job fails without it.
  slow:
    name: Julia 1.13 + deferred tests (${{ matrix.os }})
    needs: changed
    if: ${{ needs.changed.outputs.run == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write  # lets julia-actions/cache delete the superseded entry (delete-old-caches)
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"

      # Shared with CI.yml's `test` job, which restores this entry with a hand-built list
      # that must match the inputs here: `cache-name`, `include-matrix: "false"`,
      # `cache-compiled: "true"` and `cache-objcache: "false"`. Julia 1.13 writes no object
      # cache, so it stays off. `save-always: "false"` saves only from a passing run: v3
      # saves failed runs by default, and a red nightly would become the cache every PR
      # restores. Keep this job's Julia version, `--optimize` level and coverage setting
      # the same as that job's.
      - uses: julia-actions/cache@v3
        with:
          cache-compiled: "true"
          cache-name: julia-cache;unit-and-slow;julia=1.13
          include-matrix: "false"
          cache-objcache: "false"
          save-always: "false"

      - uses: julia-actions/julia-buildpkg@v1

      # A `run:` step instead of julia-actions/julia-runtest, because that action cannot pass Julia
      # flags: its harness hard-codes `julia_args` to `--check-bounds` alone. Every group of the
      # suite runs at `--optimize=1`, which on the plain harness cut the slow group from 1051 s to
      # 664 s, ext from 283 s to 184 s, backends from 274 s to 190 s, quality from 173 s to 160 s
      # and examples from 206 s to 184 s, with the same tests passing and no allocation,
      # inference or AD-gated check changing result. The call restates what the action passed:
      # `coverage=true` (its default), `--check-bounds=yes`, and `--depwarn=yes --inline=yes` on the outer process.
      # Dropped: `force_latest_compatible_version` (the action sets it to true only for
      # Dependabot/CompatHelper jobs, which these triggers are not) and `annotate` (off by
      # default). `JULIA_NUM_THREADS=auto` comes from the workflow-level `env`, so it still reaches the test subprocess.
      - run: julia --color=yes --depwarn=yes --inline=yes --project=@. -e 'import Pkg; Pkg.test(coverage=true, julia_args=["--optimize=1", "--check-bounds=yes"])'
        env:
          BRAMBLE_TEST_GROUP: slow
          # 5, below the macOS leg's 7 GB runner, so a blow-up fails by name (see
          # TestUtils.jl) before the runner just kills the job. Coverage is on by default here.
          BRAMBLE_TEST_MAXRSS_GB: 5

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true
          flags: suite
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: lcov-suite
          path: lcov.info
          if-no-files-found: warn

  test:
    name: Julia nightly (${{ matrix.os }})
    # Switched off on 2026-09-25; see the header comment for why and how to restore it.
    if: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # `nightly` is an unreleased Julia that changes daily, so it reports rather than gates:
    # a red leg here is a signal to look, not a broken package.
    #
    # Concretely, on 2026-09-05 the 1.14-dev legs began reporting 16 bytes where
    # `evaluate!` allocates 0 on both 1.12 and 1.13.0-prerelease (test/form/linear.jl:51).
    # That is the allocation guarantee working as designed — see the note above
    # `@test_allocs` in test/runtests.jl, which says a future Julia perturbing these counts
    # should fail loudly rather than quietly skip — but it is upstream news, not a defect
    # here, and it should not turn the whole nightly run red.
    #
    # It runs `slow`, not `unit`. `unit` is what a push runs, and it is now deliberately the
    # cheap core: form/jacobian_pattern.jl and the Supposition properties moved out of it
    # (test/TestUtils.jl's `WITH_SLOW_TESTS`; the worked-example pages are the `examples`
    # group now, run by docs-on-demand.yml). Those are exactly the blocks most likely to
    # notice a compiler change -- jacobian_pattern cross-checks an AD-traced sparsity pattern, and the
    # properties search their input space -- so running `unit` here would have narrowed the
    # early warning this job exists to give, as a side effect of trimming the push gate.
    continue-on-error: true
    permissions:
      contents: read
      actions: write  # lets julia-actions/cache delete the superseded entry (delete-old-caches)
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: "nightly"

      - uses: julia-actions/cache@v3
        with:
          cache-compiled: "true"

      - uses: julia-actions/julia-buildpkg@v1

      - run: julia --color=yes --depwarn=yes --inline=yes --project=@. -e 'import Pkg; Pkg.test(coverage=true, julia_args=["--optimize=1", "--check-bounds=yes"])'
        env:
          BRAMBLE_TEST_GROUP: slow
          # 5, below the macOS leg's 7 GB runner, so a blow-up fails by name (see
          # TestUtils.jl) before the runner just kills the job. Coverage is on by default here.
          BRAMBLE_TEST_MAXRSS_GB: 5

  quality:
    name: Quality (Aqua & JET, Julia ${{ matrix.version }})
    needs: changed
    if: ${{ needs.changed.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45  # a green run takes ~19 min; slower runners (2026-10-07) ran it past 30
    permissions:
      contents: read
      actions: write  # lets julia-actions/cache delete the superseded entry (delete-old-caches)
    strategy:
      fail-fast: false
      matrix:
        # Julia 1.13 only; CI no longer runs 1.12.
        #
        # This is the *only* place the quality group runs in CI. Weekly.yml used to re-derive
        # it as part of `full`, on a 2x2 matrix, to learn nothing this daily job had not
        # already reported; `full` stopped implying `quality` (test/runtests.jl) rather than
        # this job's cadence being reduced, because a quality regression found six days late
        # is a quality regression found six days late.
        version: ["1.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v3
        with:
          cache-compiled: "true"

      - uses: julia-actions/julia-buildpkg@v1

      - run: julia --color=yes --depwarn=yes --inline=yes --project=@. -e 'import Pkg; Pkg.test(coverage=true, julia_args=["--optimize=1", "--check-bounds=yes"])'
        env:
          BRAMBLE_TEST_GROUP: quality
  # Keeps the repository under its 10 GB Actions cache quota. julia-actions/cache never
  # deletes old entries on the default branch (it leaves them to GitHub's eviction), so every
  # nightly run added about 2.3 GB on `main`: a `unit-and-slow` entry per OS and a `quality`
  # entry. Only the newest entry per key prefix (the key without `;run_id=...`) is ever
  # restored, so this deletes the rest once the saving jobs are done.
  prune-caches:
    name: Prune superseded caches on main
    needs: [slow, quality]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/caches?ref=refs/heads/main&per_page=100" --jq '.actions_caches[]' |
            jq -rs 'group_by(.key | sub(";run_id=.*$"; "")) | map(sort_by(.created_at) | reverse | .[1:][]) | .[] | "\(.id) \(.key)"' |
            while read -r id key; do
              echo "Deleting $key"
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" || true
            done

  format:
    name: Format check
    needs: changed
    if: ${{ needs.changed.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"

      - name: Check SciMLStyle
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate(mktempdir())
            # Pinned: a formatter release can reformat untouched code. Keep in step with
            # .claude/scripts/format.sh.
            Pkg.add(name = "JuliaFormatter", version = "2.14.0")
            using JuliaFormatter
            format(["src", "test", "docs", "ext", "benchmark"]; overwrite = false) && exit(0)
            @error "Source is not SciMLStyle formatted. Run JuliaFormatter over src, test, docs, ext and benchmark."
            exit(1)'
