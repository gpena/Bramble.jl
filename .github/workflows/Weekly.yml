name: Weekly

# Everything the per-push CI deliberately leaves out, once a week.
#
# Enzyme and Mooncake are the reason this exists. They spend 58 seconds compiling on first
# call between them, against 1.1 s for ReverseDiff and PolyesterForwardDiff, which run on
# every push instead. What the expensive pair establishes changes when a *backend* changes
# rather than when Bramble does, so paying it per push would be paying it for nothing almost
# every time.
#
# So this is a canary rather than a gate: it is not required for a merge, and a failure here
# most often means an upstream release moved rather than that Bramble regressed. Read it
# that way before hunting in `src/`.
#
# The backends are added at run time rather than declared in `test/Project.toml`, which
# keeps Enzyme out of the dependency graph of every ordinary test run. `autodiff_backends.jl`
# skips any backend it cannot find, so the group is harmless without them.

on:
  schedule:
    # Mondays, 04:00 UTC — after CompatHelper's nightly run, so a compat bump it opens has
    # already landed or not by the time this decides what to install.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  JULIA_NUM_THREADS: auto

jobs:
  full:
    name: Full suite (Julia ${{ matrix.version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Nothing here gates a merge, but a red run should still mean something specific.
    # Julia nightly is not in this matrix (see below), so a failure here is Bramble's own —
    # either the 1.12 floor or the 1.13 release, on either OS.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The 1.12 floor and the 1.13 release, on both platforms. This is also where the
        # 1.12 floor gets its only test-suite coverage: nightly.yml runs Julia nightly only
        # (see its header comment), so this matrix is the sole place a 1.12-only break is
        # caught. Julia nightly is deliberately not here: what this workflow tests is how
        # the differentiation backends behave under a Julia version change, and `nightly`
        # itself moves daily for reasons unrelated to Bramble or to Enzyme/Mooncake, which
        # would make a red leg here noise rather than signal.
        version: ["1.12", "1.13"]
        os: [ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"

      - uses: julia-actions/julia-buildpkg@v1

      # ReverseDiff is declared in test/Project.toml and runs on every push. These three
      # are installed here so an ordinary test run never resolves them: Mooncake and Enzyme
      # because they are slow to compile, PolyesterForwardDiff because it adds nothing
      # ForwardDiff does not cover and nests threading inside kernels that already thread. Failing to add one is not fatal: the test file skips a backend it cannot
      # load, and the run still reports on the others.
      - name: Add the expensive differentiation backends
        run: |
          julia --project=test -e '
            using Pkg
            for p in ("PolyesterForwardDiff", "Mooncake", "Enzyme")
                try
                    Pkg.add(p)
                catch err
                    @warn "could not add $p; its checks will be skipped" exception=err
                end
            end'

      # Coverage is collected on one leg only: Julia 1.12 on ubuntu-latest, moved here from
      # nightly.yml along with the rest of the 1.12 floor. See CI.yml's history for why only
      # one job uploads at all.
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.version == '1.12' && matrix.os == 'ubuntu-latest' }}
        env:
          BRAMBLE_TEST_GROUP: full

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v5
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true
          fail_ci_if_error: false

  # Dependency vulnerability audit against the OSV database, which ingests Julia's own
  # JLSEC advisories from JuliaLang/SecurityAdvisories.jl alongside the CVE feeds. Weekly
  # rather than per push: advisories are published on the database's schedule, not on
  # Bramble's, so a push-triggered run would re-ask the same question for nothing.
  #
  # The manifests are gitignored, so there is nothing in a fresh checkout to scan and the
  # job resolves one first. That is also the more useful question: not "was anything
  # published against the versions someone last committed", which is no one's install, but
  # "would today's resolution of this Project.toml install anything with a known advisory".
  # One resolve is enough for all of it -- the root Project.toml declares a `[workspace]`
  # with `test`, `docs` and `benchmark` as members, so the four environments share a single
  # root Manifest.toml (382 packages as of 2026-09-13, Documenter and Supposition among
  # them).
  #
  # Report, not gate, for the same reason the rest of this workflow is a canary: all 11
  # packages the audit currently flags (84 advisories) are JLL binaries -- LibCURL_jll,
  # OpenSSL_jll, FFMPEG_jll and friends -- whose versions come from the Julia distribution
  # and upstream builders rather than from anything a commit here controls. Failing on them
  # would paint the workflow red every week over something this repository cannot fix. The
  # findings go to the job summary for a person to read.
  #
  # What *is* gated is that the audit ran. Exit codes carry that (osv-scanner docs, "Exit
  # Codes"): 0 is a clean scan, 1 is "packages scanned, advisories found", and anything else
  # is an error -- notably 128, "no packages found", which is what a silently broken
  # extractor, or a manifest that failed to resolve, looks like. So 0 and 1 pass and the
  # rest fails, and a green run means the manifest was parsed rather than that nothing was
  # found.
  security-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Pinned to an exact release, with the SHA-256 that release publishes. Bump both
      # together: the checksum is the one thing that makes downloading a binary into CI
      # different from running whatever the URL happens to serve that morning.
      OSV_SCANNER_VERSION: v2.5.1
      OSV_SCANNER_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
    steps:
      - uses: actions/checkout@v4

      # The current stable release, not the 1.12 floor the test matrix also covers: the
      # question is what an install done today resolves to, and the stdlib JLL versions a
      # manifest pins come from the Julia release that wrote it.
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      # `resolve`, not `instantiate`: the scan reads pinned versions out of the manifest and
      # never loads a package, so downloading the artifacts behind Makie and friends would
      # be minutes spent on bytes nothing here opens.
      #
      # The registry has to be added by hand first. `Pkg.add` installs General on demand
      # when a depot has no registries, but `Pkg.resolve` does not: on a fresh runner it
      # fails outright with "no registries have been installed", which is what the first
      # dispatched run of this job did.
      - name: Resolve the workspace manifest
        run: |
          julia --project=. -e '
            using Pkg
            isempty(Pkg.Registry.reachable_registries()) && Pkg.Registry.add("General")
            Pkg.resolve()'

      # The binary rather than `google/osv-scanner-action`: the scan needs a flag the action
      # does not pass through (`--experimental-plugins`, below) and needs to read the exit
      # code itself rather than let a non-zero one fail the step.
      - name: Install osv-scanner
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict -
          chmod +x osv-scanner

      # `--experimental-plugins julia/manifesttoml` is load-bearing, not decorative. The
      # Julia extractor lives in osv-scalibr and is *not* among the plugins osv-scanner
      # enables by default (its own supported-lockfiles table lists no Julia), so without
      # this flag the run ends in "could not determine extractor suitable to this file" and
      # audits nothing at all. Should the flag graduate or be renamed upstream, the scan
      # fails with exit 127/128 rather than passing empty -- which is the point of reading
      # the exit code below.
      - name: Audit the manifest against the OSV database
        run: |
          status=0
          ./osv-scanner scan source \
            --experimental-plugins julia/manifesttoml \
            -L Manifest.toml \
            --format markdown \
            --verbosity error > osv-report.md || status=$?
          echo "osv-scanner exited $status"

          {
            echo "## Dependency vulnerability audit"
            echo
            cat osv-report.md
          } >> "$GITHUB_STEP_SUMMARY"

          case "$status" in
            0) echo "No known advisories against the resolved workspace manifest." ;;
            1) echo "::notice::Known advisories found; read the job summary. Weekly.yml audits, it does not gate." ;;
            *) echo "::error::osv-scanner exited $status: the audit did not run. See the log above."
               exit "$status" ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osv-report
          path: osv-report.md
          if-no-files-found: error

  # Mutation testing (issue #121) against the four core kernels where a regression is
  # hardest to catch from a failing test alone: the difference operators
  # (form/operators/difference.jl, space/operators/difference.jl), the cell-average
  # operator (space/operators/cell_average.jl), and Dirichlet constraint application
  # (form/dirichlet_constraints.jl). Weekly rather than per push: each mutant re-runs
  # mutation/scoped_tests.jl (a scoped subset of the suite, ~65-75s uncontended), so even a
  # conservative budget takes tens of minutes to hours.
  #
  # Uses a private patched fork of Gremlins.jl, not the upstream package — see
  # mutation/run.jl's header comment and the two bugs filed against
  # SuperSeriousLab/Gremlins.jl (#8: shadow-copy Project.toml merge; #9: warm-path I4
  # self-check disagreement). Cold path only (`mutate`, not `mutate_warm`): warm reported a
  # false "killed" against a cold re-run of the same mutant on this package, which is the
  # dangerous direction, so it is not trusted here until #9 is resolved.
  #
  # `--max 60` is a provisional starting budget, not a measured one — this workflow's first
  # run is what tells us the real per-mutant cost on a GitHub-hosted runner (uncontended,
  # unlike a dev laptop). Tune it from that run's timing rather than from a local guess.
  #
  # Report, not gate, like the rest of this workflow: a low or dropping kill rate is a
  # prompt to look at the affected test file, not a reason to fail a run that otherwise
  # passed the real suite. If the job times out before `mutate()` returns, no report is
  # written at all (a known gap, acceptable while the budget is still being tuned) — read
  # the raw log for whatever mutants it reached.
  #
  # `workflow_dispatch`-only for now, deliberately not on the weekly schedule:
  # `mutation/Project.toml` sources Gremlins from a *private* mirror (gpena/Gremlins.jl —
  # see the "Gremlins upstream fix tracker" note), which a GitHub-hosted runner cannot
  # clone anonymously. Add it to the schedule once that's resolved (mirror made public, a
  # PAT secret wired up for it, or the upstream fixes land and this points at
  # SuperSeriousLab/Gremlins.jl directly).
  mutation-testing:
    name: Mutation testing (core stencils)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"

      - name: Instantiate the mutation environment
        run: julia --project=mutation -e 'using Pkg; Pkg.instantiate()'

      - name: Run mutation testing
        run: |
          JULIA_NUM_THREADS=4 julia --project=mutation --threads=4 mutation/run.jl \
            --max 60 --json mutation/report.json

      - name: Add report to job summary
        if: always()
        run: |
          if [ -f mutation/report.md ]; then
            cat mutation/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::mutation/report.md not produced — the run likely errored or timed out before completion." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            mutation/report.json
            mutation/report.md
          if-no-files-found: warn

  # Docs are not built here, or on any schedule: generation is on-demand only
  # (`docs-on-demand.yml`, `workflow_dispatch`). A broken `@ref` is an error the test suite
  # cannot see (a docstring is only cross-referenced when it is rendered), so that check now
  # runs only when the on-demand workflow is dispatched, not on a weekly cadence.
