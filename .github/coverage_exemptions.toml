path = "ext/BrambleSparseADExt.jl"
reason = "Its tests are in the AD group (ext/sparse_ad_ext.jl), switched off until v4.3.0 (BRAMBLE_TEST_AD): the AD packages are not in the test environment, so no CI leg reaches it."

