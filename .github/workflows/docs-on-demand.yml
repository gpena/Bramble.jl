name: Docs

# The only thing that deploys the documentation site. Two ways in:
#
#   * a release tag (`v*`) -- the normal path. Nothing has to be dispatched by hand
#     afterwards.
#   * `workflow_dispatch` -- for a docs-only fix, a re-run of a failed deploy, or a
#     backfill of an older version's docs.
#
# **Dispatch with a tag ref selected, not `main`.** `docs/make.jl` sets `devbranch = "main"`,
# so a build from `main` deploys to `dev/` -- a directory the version selector does not list
# (`versions` in `docs/make.jl` has no `dev` entry), which makes it invisible rather than
# absent. Dispatching a tag redeploys that version where it belongs.
#
# The file keeps its old name so every `gh workflow run docs-on-demand.yml` written down
# anywhere still works; only the display name changed when tags started triggering it.
#
# Julia 1.13, the same release every other job builds on -- keep the two in step when
# either moves.
#
# Before building, the job runs the test suite's `examples` group (test/examples/pages.jl
# and ext_pages.jl: the worked-example pages with their `#src` assertions) on the same Julia
# and OS the build uses. It gates -- no `continue-on-error` -- so a page whose assertions
# fail is never deployed. No other workflow runs this group.

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Serialised, never cancelled: two deploys racing on `gh-pages` is the failure this avoids,
# and cancelling one half-way through a push leaves the published tree in a worse state than
# making it wait.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      statuses: write
      pull-requests: write
      # julia-actions/cache@v3 deletes the superseded entries of its own key when it saves.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"

      # A depot cache of its own: every docs run spent 20-30 minutes installing and
      # precompiling from scratch. The `cache-name` keeps this entry apart from the shared
      # `unit-and-slow` one (CI.yml, nightly.yml), whose `compiled` images are for
      # `--code-coverage` builds this job never loads, so neither replaces the other.
      #
      # Scope: a run restores only entries saved on its own ref or on the default branch. A
      # tag run can restore what `main` saved, never what another tag saved, so the cache
      # pays from `main` dispatches onward; a tag's own save is visible to that tag alone.
      #
      # release-gate.yml's docs job restores this entry, so the `with:` inputs here and there
      # must stay equal.
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;docs;julia=1.13

      - uses: julia-actions/julia-buildpkg@v1

      - name: Run the worked examples
        # Every group of the suite runs at `--optimize=1` (julia-runtest's `optimize` input);
        # nightly.yml's `slow` job has the measurements. Coverage is off, and
        # `JULIA_NUM_THREADS: 4` is the ubuntu runner's vCPU count.
        uses: julia-actions/julia-runtest@v1
        with:
          optimize: "1"
          coverage: "false"
        env:
          BRAMBLE_TEST_GROUP: examples
          JULIA_NUM_THREADS: 4

      - name: Install dependencies
        run: |
          julia --color=yes --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'

      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_NUM_THREADS: 4
        run: julia --color=yes --project=docs docs/make.jl
