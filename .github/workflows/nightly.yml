name: Nightly

# Everything the per-push CI.yml deliberately leaves off, once a day: Linux entirely, Julia
# nightly, and the checks that are not canaries but don't need every-push feedback either.
# The 1.12 floor is covered weekly instead — see Weekly.yml.
#
# CI.yml's push gate is macOS-only now. Linux moved here because of a Linux-only allocation
# flake in `avgₕ!` (test/space/vector_elements.jl's "allocations do not grow with the grid"
# — an architecture-dependent `@generated` fold, documented there, not a real regression each
# time it fires) that turned an unrelated PR's gate red too often to be worth blocking pushes
# on. Julia nightly changes underneath every push regardless of what Bramble does, so gating
# on it meant the same kind of unrelated red gate. Formatting and quality (Aqua & JET) are
# not canaries in that sense, but moving them off every push trades same-push feedback for a
# leaner, faster push CI — a failure here is caught and fixed the same day rather than the
# same minute.
#
# Docs are not built here: `docs-on-demand.yml` owns them, and it deploys on a release tag
# or on demand -- never on a schedule, and never bundled into an unrelated full-matrix run.
#
# 06:00 UTC, after CompatHelper's 00:00 run, for the same reason Weekly.yml picks its own
# time after CompatHelper: a compat bump it opens has already landed or not by the time this
# decides what to install.
#
# `test` runs Julia nightly on both platforms — the 1.12 floor moved to Weekly.yml, which
# already runs the full suite (a superset of `unit`) on 1.12 and 1.13, ubuntu and macOS, so
# a separate 1.12 leg here would only repeat a narrower version of that coverage.

permissions:
  contents: read

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  JULIA_NUM_THREADS: auto

jobs:
  test:
    name: Julia nightly (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # `nightly` is an unreleased Julia that changes daily, so it reports rather than gates:
    # a red leg here is a signal to look, not a broken package.
    #
    # Concretely, on 2026-09-05 the 1.14-dev legs began reporting 16 bytes where
    # `evaluate!` allocates 0 on both 1.12 and 1.13.0-prerelease (test/form/linear.jl:51).
    # That is the allocation guarantee working as designed — see the note above
    # `@test_allocs` in test/runtests.jl, which says a future Julia perturbing these counts
    # should fail loudly rather than quietly skip — but it is upstream news, not a defect
    # here, and it should not turn the whole nightly run red.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: "nightly"

      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
        env:
          BRAMBLE_TEST_GROUP: unit

  quality:
    name: Quality (Aqua & JET, Julia ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Both supported releases. What Aqua and JET report is version-dependent in a way
        # the unit tests are not -- method ambiguities and inference results move with the
        # compiler -- so running one version here would leave the other unchecked. This job
        # was pinned to 1.12 alone while test/quality/aqua.jl still skipped the
        # persistent_tasks check on 1.13; it no longer does.
        #
        # This is the *only* place the quality group runs in CI. Weekly.yml used to re-derive
        # it as part of `full`, on a 2x2 matrix, to learn nothing this daily job had not
        # already reported; `full` stopped implying `quality` (test/runtests.jl) rather than
        # this job's cadence being reduced, because a quality regression found six days late
        # is a quality regression found six days late.
        version: ["1.12", "1.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
        env:
          BRAMBLE_TEST_GROUP: quality
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - name: Check SciMLStyle
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate(mktempdir())
            Pkg.add("JuliaFormatter")
            using JuliaFormatter
            format(["src", "test", "docs", "ext", "benchmark"]; overwrite = false) && exit(0)
            @error "Source is not SciMLStyle formatted. Run JuliaFormatter over src, test, docs, ext and benchmark."
            exit(1)'
