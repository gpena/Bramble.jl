name: Nightly

# Everything the per-push CI.yml deliberately leaves off, once a day: Linux entirely, Julia
# nightly, and the checks that are not canaries but don't need every-push feedback either.
#
# CI.yml's push gate is macOS-only now. Linux moved here because of a Linux-only allocation
# flake in `avgₕ!` (test/space/vector_elements.jl's "allocations do not grow with the grid"
# — an architecture-dependent `@generated` fold, documented there, not a real regression each
# time it fires) that turned an unrelated PR's gate red too often to be worth blocking pushes
# on. Julia nightly changes underneath every push regardless of what Bramble does, so gating
# on it meant the same kind of unrelated red gate. Spelling, formatting, quality (Aqua & JET)
# and the docs build/deploy are not canaries in that sense, but moving them off every push
# trades same-push feedback for a leaner, faster push CI — a failure here is caught and fixed
# the same day rather than the same minute.
#
# 06:00 UTC, after CompatHelper's 00:00 run, for the same reason Weekly.yml picks its own
# time after CompatHelper: a compat bump it opens has already landed or not by the time this
# decides what to install.

permissions:
  contents: read

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  JULIA_NUM_THREADS: auto

jobs:
  test:
    name: Julia ${{ matrix.version }} (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        version: ["1.12", "~1.13.0-0", "nightly"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"

      - uses: julia-actions/julia-buildpkg@v1

      # Coverage is collected on one leg only: the release version, same as before the
      # Linux/macOS split. See CI.yml's history for why only one job uploads at all.
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.version == '1.12' }}
        env:
          BRAMBLE_TEST_GROUP: unit

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.12'
      - uses: codecov/codecov-action@v5
        if: matrix.version == '1.12'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true
          fail_ci_if_error: false

  quality:
    name: Quality (Aqua & JET)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
        env:
          BRAMBLE_TEST_GROUP: quality

  spelling:
    name: Spell check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.49.0

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - name: Check SciML style
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate(mktempdir())
            Pkg.add("JuliaFormatter")
            using JuliaFormatter
            format(["src", "test"]; overwrite = false) && exit(0)
            @error "Source is not SciML formatted. Run JuliaFormatter over src and test."
            exit(1)'

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: "nightly"

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --color=yes --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'

      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --color=yes --project=docs docs/make.jl
