name: CI

# The fast gate: only the Julia version matrix that actually tests Bramble's code, on macOS
# only, and only the `unit` test group. Formatting, quality (Aqua & JET), the docs
# build/deploy, coverage upload, Linux itself, and the test blocks too expensive to pay for
# per push all moved to nightly.yml, once a day — see the comment there for why.

permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No `tags:` trigger, deliberately. A release tag points at the merge commit of the release
# PR, which this same workflow tested as the PR's merge result and again on the push to
# `main` -- so tagging used to re-run an identical matrix over an identical checkout. The
# release procedure (`.claude/skills/bramble-release`) guarantees the tag is an ancestor of
# `main` and already green before it exists.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_NUM_THREADS: auto

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'Project.toml'
              - '.github/workflows/CI.yml'
              - 'codecov.yml'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # One version, and it gates: 1.13, current release since 2026-09-10, is the Julia a
    # push has to pass on. It replaced the `~1.13.0-0` canary leg that sat here while
    # 1.13 was in prerelease, allowed to fail.
    #
    # The 1.12 floor that Project.toml still declares moved to the weekly-scheduled
    # Weekly.yml, which runs the full suite on 1.12 and 1.13, both OSes. The trade: a break
    # that only 1.12 sees is now caught the same week rather than the same push. It still
    # fails Weekly.yml when it happens.
    #
    # macOS only, deliberately. This gate exists to give a push fast feedback, and a second
    # platform doubles the runner time without doubling what is learned: the two legs run
    # the same suite over the same tree and disagree only where something is genuinely
    # architecture-dependent. Linux runs the same code daily in nightly.yml's `slow` job, on
    # the same Julia 1.13, so a Linux-only break is caught within the day rather than not at
    # all.
    #
    # There is a specific thing that Linux leg is watching for, and it is the reason it
    # lives on a cadence rather than on the gate: a Linux-only allocation flake in `avgₕ!`
    # (test/space/vector_elements.jl's "allocations do not grow with the grid") that used to
    # redden this gate on unrelated pushes. `_gauss_rule`
    # (src/space/operators/cell_average.jl) is still `@generated` and is the fold that was
    # implicated. gpena/Bramble.jl#69 and #51 rewrote everything around it — the
    # `Val{1}`/`Val{D}` split is gone and `avgₕ!` now runs through `project!` — so the shape
    # that flaked is not the shape running today, but that is a reason to expect less of it,
    # not a fix. If a Linux-only allocation assertion fails in nightly, that fold is where to
    # look first.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Spelled `1.13`, not `1` and not `~1.13.0-0`: `1` would roll onto 1.14 the day
        # it is released and gate pushes on a Julia nobody here has run yet, and the
        # range would pick up a `1.13.1-rc1` prerelease as soon as one is published.
        # `1.13` tracks released 1.13.x and nothing else.
        version: ["1.13"]
        os: [macOS-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          BRAMBLE_TEST_GROUP: unit
          # 5, below this macOS runner's 7 GB, so a blow-up fails by name (see TestUtils.jl)
          # before the runner just kills the job. Coverage is on by default here.
          BRAMBLE_TEST_MAXRSS_GB: 5

  # The check branch protection requires, for the reason release-gate.yml's `result` job
  # gives: `test` is a matrix job skipped by its `if:` when no code changed, and a skipped
  # matrix job reports under its unexpanded name.
  result:
    name: CI result
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            case "$r" in success|skipped) ;; *) echo "a CI job ended $r"; exit 1 ;; esac
          done
