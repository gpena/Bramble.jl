[erased_class_check]
base_ast_types_equal_a_b = false
base_erased = 0
head_ast_types_equal_a_b = true
head_erased = 3
what = "simplify_ast(resolve_ast(innerₕ(a, t) + innerₕ(b, t) + innerₕ(c, t))) with closures_fresh's anonymous_a/b: count of SourceFunction{2, Function} leaves"

[inline_linear_form]
base_concrete = true
code = "form(W, v -> innerₕ(x -> x[1]^2, v))"
head_concrete = true
literal_x_squared_base_concrete = false
literal_x_squared_head_concrete = false
note = "the literal x -> x^2 throws a MethodError on a 2D point on both trees, so its return type is not concrete"

[restrict_outer_linear_form]
base_concrete = true
code = "form(W, v -> restrict_to(:interior, innerₕ(x -> x[1]^2, v)))"
head_concrete = false
literal_x_squared_base_concrete = true
literal_x_squared_head_concrete = true
note = "x -> x^2 on a 2D point (a tuple) has no Float64 result, so it is never erased and is no test of the loss; x -> x[1]^2 is the erased-class closure"

[run]
date = "2026-10-27"
julia = "1.13.2"
launches = 3
machine = "Apple M2, 8 cores, AC power, OneDrive not running, gate_preflight.sh --timing passed (load 1.72)"
optimize = "default (-O2)"
order = "interleaved base, head per launch; one snoop_instances.jl --launches 1 run per side per launch"
script = "benchmark/snoop_instances.jl (identical in both trees)"
threads = 4

[verdict]
form_below_by_more_than_spreads = true
instances_at_most_half = true
rule = "ship if head closures_fresh second_instances <= base/2, and base-head second_form_s median > both spreads, and warm assemble within max(base spread, 3%) on rows whose base warm time >= 50 us (shorter rows reported, not gated); else reverted"
s6_1 = "shipped"
warm_gated_rows = []
warm_within_bound = true
