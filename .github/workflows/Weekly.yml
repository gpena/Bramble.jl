name: Weekly

# Everything the per-push CI deliberately leaves out, once a week.
#
# Not the quality group, though -- Aqua, JET, explicit-imports, exports and invalidations run
# daily in nightly.yml, and `full` used to drag them in here as well, four times over on this
# matrix. `full` no longer implies `quality` (see test/runtests.jl).
#
# Nor the `slow` group: nightly.yml's `slow` job runs it daily on the same Julia 1.13 and
# both platforms, and its ubuntu leg uploads that half of the coverage. This workflow runs
# the other half, the `backends` group (the package extensions), on both platforms, and the
# per-file coverage floor over both halves. Together they cover what `full` does except the
# manual snippets, which only run locally anyway. The worked-example pages are in neither
# half: they are the `examples` group, which docs-on-demand.yml runs before every docs build.
#
# AD and GPU tests are switched off in every group until v4.3.0 and v4.4.0 respectively
# (test/TestUtils.jl, `WITH_AD_TESTS` and `WITH_GPU_TESTS`, and the `ad` and `gpu` groups).
# Each comes back by setting `BRAMBLE_TEST_AD` or `BRAMBLE_TEST_GPU` in this workflow's env
# and adding its packages: the step that installed Enzyme, Mooncake, PolyesterForwardDiff
# and SciMLSensitivity for the `backends` group is gone, and v4.3.0 restores it from git
# history together with the AD tests.
#
# This is a canary rather than a gate: it is not required for a merge, and a failure here
# most often means an upstream release moved rather than that Bramble regressed. Read it
# that way before hunting in `src/`.

on:
  schedule:
    # Mondays, 04:00 UTC — after CompatHelper's nightly run, so a compat bump it opens has
    # already landed or not by the time this decides what to install.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  JULIA_NUM_THREADS: auto

jobs:
  # As in nightly.yml: a scheduled run on the same `main` commit as the last successful
  # scheduled run would repeat its `full` legs exactly, so they stop here. A manual
  # dispatch always runs. The security audit does not wait on this: advisories are published
  # whether or not `main` moved.
  changed:
    name: New commits since the last green weekly
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/Weekly.yml/runs?branch=main&event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "${{ github.sha }}" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  full:
    name: Package extensions (Julia ${{ matrix.version }}, ${{ matrix.os }})
    needs: changed
    if: ${{ needs.changed.outputs.run == 'true' }}
    runs-on: ${{ matrix.os }}
    # The `backends` legs took 5 to 25 minutes in the last three runs; compiled images are not
    # cached here (see below), so a leg spends most of its time precompiling.
    timeout-minutes: 60
    # Nothing here gates a merge, but a red run should still mean something specific.
    # Julia nightly is not in this matrix (see below), so a failure here is Bramble's own —
    # on the 1.13 release, on either OS.
    #
    # id-token: write is for the codecov-action step below (`use_oidc: true`, Julia 1.13 on
    # ubuntu-latest only) -- without it, requesting an OIDC token throws an unhandled error
    # in the action's own github-script substep before its own `fail_ci_if_error: false`
    # ever gets a chance to apply, failing the whole job even though every test passed.
    permissions:
      contents: read
      actions: write  # lets julia-actions/cache delete the superseded entry (delete-old-caches)
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # The 1.13 release, on both platforms. Julia nightly is deliberately not here: what
        # this workflow tests is how the package extensions behave under their own upstream
        # releases, and `nightly` itself moves daily for reasons unrelated to Bramble, which would make a
        # red leg here noise rather than signal.
        version: ["1.13"]
        os: [ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      # Compiled images are not cached here, on purpose. When this job had eight legs they were about 5 GB, and
      # the repository's cache quota is 10 GB: they evicted the `unit-and-slow` entry that CI
      # restores for every PR and Nightly saves on `main` (CI.yml, nightly.yml). The registry,
      # the packages and the artifacts are still cached; the compile cost (a warm leg ran about
      # half as long) is the price of keeping CI, Nightly and the docs warm. Weekly runs once a
      # week and on demand.
      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "false"

      - uses: julia-actions/julia-buildpkg@v1

      # Coverage is collected on the ubuntu leg only; the `slow` half comes from nightly.yml.
      # See CI.yml's history for why only one leg per half uploads at all.
      # A `run:` step instead of julia-actions/julia-runtest, because that action cannot pass Julia
      # flags: its harness hard-codes `julia_args` to `--check-bounds` alone. Every group of the
      # suite runs at `--optimize=1`, which on the plain harness cut the slow group from 1051 s to
      # 664 s, ext from 283 s to 184 s, backends from 274 s to 190 s, quality from 173 s to 160 s
      # and examples from 206 s to 184 s, with the same tests passing and no allocation,
      # inference or AD-gated check changing result. The call restates what the action passed:
      # `coverage` from the same expression the `with:` input had (on for the ubuntu leg only), `--check-bounds=yes`, and `--depwarn=yes --inline=yes` on the outer process.
      # Dropped: `force_latest_compatible_version` (the action sets it to true only for
      # Dependabot/CompatHelper jobs, which these triggers are not) and `annotate` (off by
      # default). `JULIA_NUM_THREADS=auto` comes from the workflow-level `env`.
      - run: julia --color=yes --depwarn=yes --inline=yes --project=@. -e 'import Pkg; Pkg.test(coverage=${{ matrix.os == 'ubuntu-latest' }}, julia_args=["--optimize=1", "--check-bounds=yes"])'
        env:
          BRAMBLE_TEST_GROUP: backends

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true
          flags: backends
          fail_ci_if_error: false
      # Kept for the `coverage-floor` job below: each half sees only its own files.
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: lcov-backends
          path: lcov.info
          if-no-files-found: warn

  # Per-file coverage floor over the two coverage halves merged: `lcov-backends` from this
  # run, and `lcov-suite` from the newest nightly.yml run on `main` that produced one. The
  # halves can come from different commits, at most a week apart; nightly's half is
  # normally from the Sunday run. Writes the report to the job summary, then
  # fails the job when a non-exempt src/ file is below the floor (`--fail --prefix src/`);
  # ext/ files stay in the report but cannot fail it.
  coverage-floor:
    name: Per-file coverage floor
    needs: full
    # Not when `full` was skipped for an unchanged `main`: there is nothing to report on.
    if: ${{ always() && needs.full.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # to download nightly.yml's `lcov-suite` artifact
    steps:
      - uses: actions/checkout@v5

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"

      # A leg that died before processing coverage uploads nothing; report on what exists.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: lcov-*
          path: lcov

      - name: Fetch the `slow` half from the newest nightly
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=lcov-suite&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].workflow_run.id // ""')
          if [ -z "$run_id" ]; then echo "::warning::No unexpired lcov-suite artifact from nightly.yml on main."; exit 0; fi
          gh run download "$run_id" --repo "${{ github.repository }}" --name lcov-suite --dir lcov/lcov-suite

      - name: Report the per-file coverage floor
        run: |
          files=$(find lcov -name lcov.info 2>/dev/null | sort)
          if [ -z "$files" ]; then
            echo "::warning::No lcov artifacts found; skipping the coverage floor."
            echo "No lcov artifacts from the coverage legs; floor not computed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Capture the status so the summary is written before the step fails.
          julia .github/scripts/coverage_floor.jl --floor 90 --fail --prefix src/ \
            --exempt .github/coverage_exemptions.toml $files > floor.txt && status=0 || status=$?
          {
            echo "## Per-file coverage floor (90%, src/)"
            echo
            echo "Inputs: $(echo $files | tr '\n' ' ')"
            echo
            echo '```'
            cat floor.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat floor.txt
          exit "$status"

  # Dependency vulnerability audit against the OSV database, which ingests Julia's own
  # JLSEC advisories from JuliaLang/SecurityAdvisories.jl alongside the CVE feeds. Weekly
  # rather than per push: advisories are published on the database's schedule, not on
  # Bramble's, so a push-triggered run would re-ask the same question for nothing.
  #
  # The manifests are gitignored, so there is nothing in a fresh checkout to scan and the
  # job resolves one first. That is also the more useful question: not "was anything
  # published against the versions someone last committed", which is no one's install, but
  # "would today's resolution of this Project.toml install anything with a known advisory".
  # One resolve is enough for all of it -- the root Project.toml declares a `[workspace]`
  # with `test`, `docs` and `benchmark` as members, so the four environments share a single
  # root Manifest.toml (382 packages as of 2026-09-13, Documenter and Supposition among
  # them).
  #
  # Report, not gate, for the same reason the rest of this workflow is a canary: all 11
  # packages the audit currently flags (84 advisories) are JLL binaries -- LibCURL_jll,
  # OpenSSL_jll, FFMPEG_jll and friends -- whose versions come from the Julia distribution
  # and upstream builders rather than from anything a commit here controls. Failing on them
  # would paint the workflow red every week over something this repository cannot fix. The
  # findings go to the job summary for a person to read.
  #
  # What *is* gated is that the audit ran. Exit codes carry that (osv-scanner docs, "Exit
  # Codes"): 0 is a clean scan, 1 is "packages scanned, advisories found", and anything else
  # is an error -- notably 128, "no packages found", which is what a silently broken
  # extractor, or a manifest that failed to resolve, looks like. So 0 and 1 pass and the
  # rest fails, and a green run means the manifest was parsed rather than that nothing was
  # found.
  security-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Pinned to an exact release, with the SHA-256 that release publishes. Bump both
      # together: the checksum is the one thing that makes downloading a binary into CI
      # different from running whatever the URL happens to serve that morning.
      OSV_SCANNER_VERSION: v2.5.1
      OSV_SCANNER_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
    steps:
      - uses: actions/checkout@v5

      # The current stable release, not the 1.13 the test matrix pins: the
      # question is what an install done today resolves to, and the stdlib JLL versions a
      # manifest pins come from the Julia release that wrote it.
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      # `resolve`, not `instantiate`: the scan reads pinned versions out of the manifest and
      # never loads a package, so downloading the artifacts behind Makie and friends would
      # be minutes spent on bytes nothing here opens.
      #
      # The registry has to be added by hand first. `Pkg.add` installs General on demand
      # when a depot has no registries, but `Pkg.resolve` does not: on a fresh runner it
      # fails outright with "no registries have been installed", which is what the first
      # dispatched run of this job did.
      - name: Resolve the workspace manifest
        run: |
          julia --project=. -e '
            using Pkg
            isempty(Pkg.Registry.reachable_registries()) && Pkg.Registry.add("General")
            Pkg.resolve()'

      # The binary rather than `google/osv-scanner-action`: the scan needs a flag the action
      # does not pass through (`--experimental-plugins`, below) and needs to read the exit
      # code itself rather than let a non-zero one fail the step.
      - name: Install osv-scanner
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict -
          chmod +x osv-scanner

      # `--experimental-plugins julia/manifesttoml` is load-bearing, not decorative. The
      # Julia extractor lives in osv-scalibr and is *not* among the plugins osv-scanner
      # enables by default (its own supported-lockfiles table lists no Julia), so without
      # this flag the run ends in "could not determine extractor suitable to this file" and
      # audits nothing at all. Should the flag graduate or be renamed upstream, the scan
      # fails with exit 127/128 rather than passing empty -- which is the point of reading
      # the exit code below.
      - name: Audit the manifest against the OSV database
        run: |
          status=0
          ./osv-scanner scan source \
            --experimental-plugins julia/manifesttoml \
            -L Manifest.toml \
            --format markdown \
            --verbosity error > osv-report.md || status=$?
          echo "osv-scanner exited $status"

          {
            echo "## Dependency vulnerability audit"
            echo
            cat osv-report.md
          } >> "$GITHUB_STEP_SUMMARY"

          case "$status" in
            0) echo "No known advisories against the resolved workspace manifest." ;;
            1) echo "::notice::Known advisories found; read the job summary. Weekly.yml audits, it does not gate." ;;
            *) echo "::error::osv-scanner exited $status: the audit did not run. See the log above."
               exit "$status" ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osv-report
          path: osv-report.md
          if-no-files-found: error

  # Docs are not built here, or on any schedule: `docs-on-demand.yml` owns them and deploys
  # on a release tag or on demand. A broken `@ref` is an error the test suite cannot see (a
  # docstring is only cross-referenced when it is rendered), so that check runs when the docs
  # are built -- at release time, and in the local gate the release procedure requires.
