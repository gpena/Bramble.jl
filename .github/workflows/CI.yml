name: CI

# The fast gate: only the Julia version matrix that actually tests Bramble's code, on macOS
# only, and only the `unit` test group. Formatting, quality (Aqua & JET), the docs
# build/deploy, coverage upload, Linux itself, and the test blocks too expensive to pay for
# per push all moved to nightly.yml, once a day — see the comment there for why.

permissions:
  contents: read
on:
  pull_request:
  workflow_dispatch:

# No `push` or `tags:` trigger, deliberately. `main` moves only by merging a PR, and branch
# protection requires the branch to be up to date first, so the PR's merge-result run has
# already tested the exact tree the merge commit lands; a push run would repeat it. A release
# tag points at that same merge commit. The release procedure
# (`.claude/skills/bramble-release`) guarantees the tag is an ancestor of `main` and already
# green before it exists.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_NUM_THREADS: auto

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'Project.toml'
              - '.github/workflows/CI.yml'
              - 'codecov.yml'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # One version, and it gates: 1.13, current release since 2026-09-10, is the Julia a
    # push has to pass on. It replaced the `~1.13.0-0` canary leg that sat here while
    # 1.13 was in prerelease, allowed to fail.
    #
    # macOS only, deliberately. This gate exists to give a push fast feedback, and a second
    # platform doubles the runner time without doubling what is learned: the two legs run
    # the same suite over the same tree and disagree only where something is genuinely
    # architecture-dependent. Linux runs the same code daily in nightly.yml's `slow` job, on
    # the same Julia 1.13, so a Linux-only break is caught within the day rather than not at
    # all.
    #
    # There is a specific thing that Linux leg is watching for, and it is the reason it
    # lives on a cadence rather than on the gate: a Linux-only allocation flake in `avgₕ!`
    # (test/space/vector_elements.jl's "allocations do not grow with the grid") that used to
    # redden this gate on unrelated pushes. `_gauss_rule`
    # (src/operators/cell_average.jl) is still `@generated` and is the fold that was
    # implicated. The code around it has since been rewritten, so the shape that
    # flaked is not the shape running today, but that is a reason to expect less of it, not a
    # fix. If a Linux-only allocation assertion fails in nightly, that fold is where to
    # look first.
    # 60, as nightly.yml's `slow` has: a cold run takes 30 to 38 minutes, and without a limit
    # a hung run would hold the runner for GitHub's default of six hours.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Spelled `1.13`, not `1` and not `~1.13.0-0`: `1` would roll onto 1.14 the day
        # it is released and gate pushes on a Julia nobody here has run yet, and the
        # range would pick up a `1.13.1-rc1` prerelease as soon as one is published.
        # `1.13` tracks released 1.13.x and nothing else.
        version: ["1.13"]
        os: [macOS-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      # Shares one cache with nightly.yml's `slow` job: the same `cache-name`, and
      # `include-matrix: false` so the two matrices do not split the key (the runner OS is
      # still in it). CI.yml never runs on `main`, so on its own every PR started cold (about
      # 35 minutes, 19 of them precompiling dependencies); nightly's macOS leg saves under
      # `main`, which a PR can restore. A warm run measured 997 s against 2100 s cold. Both
      # jobs must keep the same Julia version, `--optimize` level and coverage setting, since
      # whichever saved last is what the next PR restores; change them together.
      #
      # Restore-only: a PR's entry is scoped to its own merge ref, so no other PR can restore
      # it, and each one was about 550 MB against the repository's 10 GB cache quota. Only
      # nightly.yml saves. `actions/cache/restore` stands in for julia-actions/cache v3, which
      # still has no restore-only input; the key and paths below are what that action builds
      # for this `cache-name` with `include-matrix: false`. The cache version hashes the path
      # strings, so they must be the expanded `$HOME` paths it uses, in its order, with the
      # `!` exclusion patterns it appends (v3 added them), or nothing matches. A
      # `julia-actions/cache` bump, a Dependabot one included, must re-derive this list from
      # its `src/main.ts`.
      - id: depot
        run: |
          mkdir -p "$HOME/.julia"
          echo "path=$HOME/.julia" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.depot.outputs.path }}/artifacts
            ${{ steps.depot.outputs.path }}/packages
            ${{ steps.depot.outputs.path }}/registries
            ${{ steps.depot.outputs.path }}/compiled
            ${{ steps.depot.outputs.path }}/scratchspaces
            ${{ steps.depot.outputs.path }}/logs
            !${{ steps.depot.outputs.path }}/artifacts/*.pid
            !${{ steps.depot.outputs.path }}/artifacts/*.pidfile
            !${{ steps.depot.outputs.path }}/compiled/v*.*/*.pid
            !${{ steps.depot.outputs.path }}/compiled/v*.*/*.pidfile
            !${{ steps.depot.outputs.path }}/compiled/v*.*/*/*.pid
            !${{ steps.depot.outputs.path }}/compiled/v*.*/*/*.pidfile
            !${{ steps.depot.outputs.path }}/packages/*/*.pid
            !${{ steps.depot.outputs.path }}/packages/*/*.pidfile
            !${{ steps.depot.outputs.path }}/registries/*/.pid
            !${{ steps.depot.outputs.path }}/registries/*/.pidfile
            !${{ steps.depot.outputs.path }}/logs/*.pid
            !${{ steps.depot.outputs.path }}/logs/*.pidfile
            !${{ steps.depot.outputs.path }}/cache/v*.*/*/lock.mdb
          key: julia-cache;unit-and-slow;julia=1.13;os=${{ runner.os }};
          restore-keys: julia-cache;unit-and-slow;julia=1.13;os=${{ runner.os }};
      # As julia-actions/cache does: a restored registry may be older than a compat bump.
      - name: Update any cached registries
        continue-on-error: true
        run: |
          if [ -n "$(ls -A "$HOME/.julia/registries" 2>/dev/null)" ]; then
            julia -e 'import Pkg; Pkg.Registry.update()'
          fi
      - uses: julia-actions/julia-buildpkg@v1
      # A `run:` step instead of julia-actions/julia-runtest, because that action has no input
      # that reaches the Julia flags: its harness hard-codes `julia_args` to `--check-bounds`
      # alone, and `prefix` only goes in front of the `julia` command. The unit group runs at
      # `--optimize=1` because the run is more than 95% compile: on the plain
      # `test/runtests.jl` run, -O1 cuts 661 s to 461 s with all 14952 tests passing, the
      # static allocation checks included. `-O0` is faster (231 s) but breaks the Float32 GMG
      # allocation test in test/solvers/multigrid.jl, so it is not used. Every other workflow
      # runs its groups at -O1 too; their comments give the per-group measurements.
      #
      # The call restates what the action passed: `coverage=true` (its default) and
      # `--check-bounds=yes`, plus `--depwarn=yes` and `--inline=yes` on the outer process.
      # Dropped: `force_latest_compatible_version`, which the action sets to true only for
      # Dependabot/CompatHelper jobs and which does not apply to a pull_request run here, and
      # the `annotate` option (off by default). `JULIA_NUM_THREADS=auto` comes from the
      # workflow-level `env`, so it still reaches the test subprocess.
      #
      # Open question: Julia keys package image caches on the optimisation level, so the -O1
      # test subprocess probably recompiles every dependency once on a cold cache.
      # The `compiled` directory restored above should keep those images across runs, so the cost
      # would fall on cold runners only. This has not been measured.
      - run: julia --color=yes --depwarn=yes --inline=yes --project=@. -e 'import Pkg; Pkg.test(coverage=true, julia_args=["--optimize=1", "--check-bounds=yes"])'
        env:
          BRAMBLE_TEST_GROUP: unit
          # 5, below this macOS runner's 7 GB, so a blow-up fails by name (see TestUtils.jl)
          # before the runner just kills the job. Coverage is on here, as it was by default.
          BRAMBLE_TEST_MAXRSS_GB: 5

  # The check branch protection requires, for the reason release-gate.yml's `result` job
  # gives: `test` is a matrix job skipped by its `if:` when no code changed, and a skipped
  # matrix job reports under its unexpanded name.
  result:
    name: CI result
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            case "$r" in success|skipped) ;; *) echo "a CI job ended $r"; exit 1 ;; esac
          done
