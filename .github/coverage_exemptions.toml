# Files exempt from the per-file coverage floor (.github/scripts/coverage_floor.jl).
#
# A file may be exempt only when coverage cannot reach it on the CI leg: it needs specific
# hardware, it needs a specific operating system, or it runs at load or precompile time,
# before the coverage tracer is active. "Hard to test" is not a reason.
#
# src/utils/device_kernels.jl and src/solvers/accelerate_solver.jl are deliberately not
# listed. Their generic fallbacks and error paths run on Linux, so they stay measured.
#
# This is a separate file, rather than more codecov.yml ignores, so that Codecov still shows
# these files and the list can be reviewed on its own.
#
# `[[exempt_function]]` entries (`path`, `functions`, `reason`) exempt single functions rather
# than files, under the same rule. Each reason starts with a label: `device-only:` (a
# KernelAbstractions, Metal or AppleAccelerate path; the test environment has none of them),
# `macro-expansion:` or `load-time:`. A host fallback or error path is never listed.

[[exempt]]
path = "src/Bramble.jl"
reason = "The module file runs its includes and exports at load time."

[[exempt]]
path = "src/operators/node_family.jl"
reason = "The body of the @node_family macro runs at macro-expansion time, during load or precompilation."

[[exempt]]
path = "src/precompile.jl"
reason = "The precompile workload runs while the package precompiles, not in the test process."

[[exempt]]
path = "src/precompile/*_sessions.jl"
reason = "The session functions are called only by the precompile workload, while precompiling."

