name: Docs

# The only thing that deploys the documentation site. Two ways in:
#
#   * a release tag (`v*`) -- the normal path. The release procedure records this version's
#     benchmark baseline *before* the tag, so the tag commit already carries its own data
#     point and this build publishes a complete `benchmarks.md`. Nothing has to be
#     dispatched by hand afterwards.
#   * `workflow_dispatch` -- for a docs-only fix, a re-run of a failed deploy, or a
#     backfill of an older version's docs.
#
# **Dispatch with a tag ref selected, not `main`.** `docs/make.jl` sets `devbranch = "main"`,
# so a build from `main` deploys to `dev/` -- a directory the version selector does not list
# (`versions` in `docs/make.jl` has no `dev` entry), which makes it invisible rather than
# absent. Dispatching a tag redeploys that version where it belongs.
#
# The file keeps its old name so every `gh workflow run docs-on-demand.yml` written down
# anywhere still works; only the display name changed when tags started triggering it.
#
# Julia 1.13, the same release every other job builds on -- keep the two in step when
# either moves.
#
# Before building, the job runs the test suite's `examples` group (test/examples/pages.jl
# and ext_pages.jl: the worked-example pages with their `#src` assertions) on the same Julia
# and OS the build uses. It gates -- no `continue-on-error` -- so a page whose assertions
# fail is never deployed. No other workflow runs this group.

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Serialised, never cancelled: two deploys racing on `gh-pages` is the failure this avoids,
# and cancelling one half-way through a push leaves the published tree in a worse state than
# making it wait.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write  # lets julia-actions/cache delete the superseded entry (delete-old-caches)
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"

      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"

      - uses: julia-actions/julia-buildpkg@v1

      - name: Run the worked examples
        # A `run:` step instead of julia-actions/julia-runtest, because that action cannot pass Julia
        # flags: its harness hard-codes `julia_args` to `--check-bounds` alone. Every group of the
        # suite runs at `--optimize=1`, which on the plain harness cut the slow group from 1051 s to
        # 664 s, ext from 283 s to 184 s, backends from 274 s to 190 s, quality from 173 s to 160 s
        # and examples from 206 s to 184 s, with the same tests passing and no allocation,
        # inference or AD-gated check changing result. The call restates what the action passed:
        # `coverage=false`, as the `with:` input had it, `--check-bounds=yes`, and `--depwarn=yes --inline=yes` on the outer process.
        # Dropped: `force_latest_compatible_version` (the action sets it to true only for
        # Dependabot/CompatHelper jobs, which these triggers are not) and `annotate` (off by
        # default). `JULIA_NUM_THREADS: auto` stays in the step's `env`.
        run: julia --color=yes --depwarn=yes --inline=yes --project=@. -e 'import Pkg; Pkg.test(coverage=false, julia_args=["--optimize=1", "--check-bounds=yes"])'
        env:
          BRAMBLE_TEST_GROUP: examples
          JULIA_NUM_THREADS: auto

      - name: Install dependencies
        run: |
          julia --color=yes --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'

      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_NUM_THREADS: auto
        run: julia --color=yes --project=docs docs/make.jl
