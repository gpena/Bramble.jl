name: Weekly

# Everything the per-push CI deliberately leaves out, once a week.
#
# Enzyme and Mooncake are the reason this exists. They spend 58 seconds compiling on first
# call between them, against 1.1 s for ReverseDiff and PolyesterForwardDiff, which run on
# every push instead. What the expensive pair establishes changes when a *backend* changes
# rather than when Bramble does, so paying it per push would be paying it for nothing almost
# every time.
#
# So this is a canary rather than a gate: it is not required for a merge, and a failure here
# most often means an upstream release moved rather than that Bramble regressed. Read it
# that way before hunting in `src/`.
#
# The backends are added at run time rather than declared in `test/Project.toml`, which
# keeps Enzyme out of the dependency graph of every ordinary test run. `autodiff_backends.jl`
# skips any backend it cannot find, so the group is harmless without them.

on:
  schedule:
    # Mondays, 04:00 UTC — after CompatHelper's nightly run, so a compat bump it opens has
    # already landed or not by the time this decides what to install.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  JULIA_NUM_THREADS: auto

jobs:
  full:
    name: Full suite (Julia ${{ matrix.version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Nothing here gates a merge, but a red run should still mean something specific, so
    # `nightly` reports rather than counting: it is an unreleased Julia that moves on its
    # own, and Enzyme and Mooncake — the reason this workflow exists — are the first
    # packages to stop building on it. The add step below already tolerates a backend it
    # cannot install and `autodiff_backends.jl` skips one it cannot load, so expect the
    # nightly legs to cover less than the released ones rather than to fail outright.
    continue-on-error: ${{ matrix.version == 'nightly' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The 1.12 floor, the 1.13 release, and nightly. Unlike CI.yml and nightly.yml,
        # this workflow runs every version it can: what it tests is how the differentiation
        # backends behave, and that is exactly the thing a Julia version change moves.
        version: ["1.12", "1.13", "nightly"]
        os: [ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"

      - uses: julia-actions/julia-buildpkg@v1

      # ReverseDiff is declared in test/Project.toml and runs on every push. These three
      # are installed here so an ordinary test run never resolves them: Mooncake and Enzyme
      # because they are slow to compile, PolyesterForwardDiff because it adds nothing
      # ForwardDiff does not cover and nests threading inside kernels that already thread. Failing to add one is not fatal: the test file skips a backend it cannot
      # load, and the run still reports on the others.
      - name: Add the expensive differentiation backends
        run: |
          julia --project=test -e '
            using Pkg
            for p in ("PolyesterForwardDiff", "Mooncake", "Enzyme")
                try
                    Pkg.add(p)
                catch err
                    @warn "could not add $p; its checks will be skipped" exception=err
                end
            end'

      - uses: julia-actions/julia-runtest@v1
        env:
          BRAMBLE_TEST_GROUP: full

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 1.13, matching the other docs jobs and the push gate. The version matters less
      # here than in `full` above -- what this catches is a broken cross-reference, not
      # anything version-specific -- but there is no reason for it to drift.
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"
      - uses: julia-actions/cache@v2
      # A broken `@ref` is an error the test suite cannot see: a docstring is only
      # cross-referenced when it is rendered, so nothing catches it until the docs are
      # built. Two have slipped through already.
      - name: Build the documentation
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()'
          julia --project=docs docs/make.jl
        env:
          GKSwstype: "100"
