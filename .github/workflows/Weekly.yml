name: Weekly

# Everything the per-push CI deliberately leaves out, once a week.
#
# Enzyme and Mooncake are the reason this exists. They spend 58 seconds compiling on first
# call between them, against 1.1 s for ReverseDiff and PolyesterForwardDiff, which run on
# every push instead. What the expensive pair establishes changes when a *backend* changes
# rather than when Bramble does, so paying it per push would be paying it for nothing almost
# every time.
#
# So this is a canary rather than a gate: it is not required for a merge, and a failure here
# most often means an upstream release moved rather than that Bramble regressed. Read it
# that way before hunting in `src/`.
#
# The backends are added at run time rather than declared in `test/Project.toml`, which
# keeps Enzyme out of the dependency graph of every ordinary test run. `autodiff_backends.jl`
# skips any backend it cannot find, so the group is harmless without them.

on:
  schedule:
    # Mondays, 04:00 UTC — after CompatHelper's nightly run, so a compat bump it opens has
    # already landed or not by the time this decides what to install.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  JULIA_NUM_THREADS: auto

jobs:
  full:
    name: Full suite (Julia ${{ matrix.version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Nothing here gates a merge, but a red run should still mean something specific.
    # Julia nightly is not in this matrix (see below), so a failure here is Bramble's own —
    # either the 1.12 floor or the 1.13 release, on either OS.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The 1.12 floor and the 1.13 release, on both platforms. This is also where the
        # 1.12 floor gets its only test-suite coverage: nightly.yml runs Julia nightly only
        # (see its header comment), so this matrix is the sole place a 1.12-only break is
        # caught. Julia nightly is deliberately not here: what this workflow tests is how
        # the differentiation backends behave under a Julia version change, and `nightly`
        # itself moves daily for reasons unrelated to Bramble or to Enzyme/Mooncake, which
        # would make a red leg here noise rather than signal.
        version: ["1.12", "1.13"]
        os: [ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"

      - uses: julia-actions/julia-buildpkg@v1

      # ReverseDiff is declared in test/Project.toml and runs on every push. These three
      # are installed here so an ordinary test run never resolves them: Mooncake and Enzyme
      # because they are slow to compile, PolyesterForwardDiff because it adds nothing
      # ForwardDiff does not cover and nests threading inside kernels that already thread. Failing to add one is not fatal: the test file skips a backend it cannot
      # load, and the run still reports on the others.
      - name: Add the expensive differentiation backends
        run: |
          julia --project=test -e '
            using Pkg
            for p in ("PolyesterForwardDiff", "Mooncake", "Enzyme")
                try
                    Pkg.add(p)
                catch err
                    @warn "could not add $p; its checks will be skipped" exception=err
                end
            end'

      # Coverage is collected on one leg only: Julia 1.12 on ubuntu-latest, moved here from
      # nightly.yml along with the rest of the 1.12 floor. See CI.yml's history for why only
      # one job uploads at all.
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.version == '1.12' && matrix.os == 'ubuntu-latest' }}
        env:
          BRAMBLE_TEST_GROUP: full

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v5
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true
          fail_ci_if_error: false

  # Dependency vulnerability audit against the OSV database, which ingests Julia's own
  # JLSEC advisories from JuliaLang/SecurityAdvisories.jl alongside the CVE feeds. Weekly
  # rather than per push: advisories are published on the database's schedule, not on
  # Bramble's, so a push-triggered run would re-ask the same question for nothing.
  #
  # Report, not gate, for the same reason the rest of this workflow is a canary. Measured
  # on 2026-09-13, the three manifests hold 633 packages and 315 known advisories, and 29
  # of the 30 affected packages are JLL binaries pinned by the Julia distribution itself
  # (LibCURL_jll, OpenSSL_jll, MbedTLS_jll, nghttp2_jll and friends) -- Bramble cannot bump
  # those without a new Julia release, so failing on them would paint the workflow red every
  # week for something no commit here can fix. The findings go to the job summary for a
  # person to read; what *is* gated is that the scan actually parsed the manifests.
  #
  # Exit codes carry that distinction (osv-scanner docs, "Exit Codes"): 0 is a clean scan,
  # 1 is "packages scanned, advisories found", and everything else is an error -- notably
  # 128, "no packages found", which is what a silently broken extractor looks like. So 0
  # and 1 pass and the rest fails, and a green run means the audit ran rather than that it
  # found nothing.
  security-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Pinned to an exact release, with the SHA-256 the release publishes. Bump both
      # together: the checksum is the one thing that makes downloading a binary into CI
      # different from running whatever the URL happens to serve that morning.
      OSV_SCANNER_VERSION: v2.5.1
      OSV_SCANNER_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
    steps:
      - uses: actions/checkout@v4

      # The binary rather than `google/osv-scanner-action`: the scan needs a flag the action
      # does not pass through (`--experimental-plugins`, below) and needs to read the exit
      # code itself rather than let a non-zero one fail the step.
      - name: Install osv-scanner
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict -
          chmod +x osv-scanner

      # `--experimental-plugins julia/manifesttoml` is load-bearing, not decorative. The
      # Julia extractor lives in osv-scalibr and is *not* among the plugins osv-scanner
      # enables by default (its own supported-lockfiles table lists no Julia), so without
      # this flag the run ends in "could not determine extractor suitable to this file" and
      # audits nothing at all. Should the flag graduate or be renamed upstream, the scan
      # fails with exit 127/128 rather than passing empty -- which is the point of reading
      # the exit code below.
      - name: Audit the manifests against the OSV database
        run: |
          status=0
          ./osv-scanner scan source \
            --experimental-plugins julia/manifesttoml \
            -L Manifest.toml \
            -L test/Manifest.toml \
            -L docs/Manifest.toml \
            --format markdown > osv-report.md || status=$?

          {
            echo "## Dependency vulnerability audit"
            echo
            cat osv-report.md
          } >> "$GITHUB_STEP_SUMMARY"

          case "$status" in
            0) echo "No known advisories against the three manifests." ;;
            1) echo "::notice::Known advisories found; read the job summary. Weekly.yml audits, it does not gate." ;;
            *) echo "::error::osv-scanner exited $status: the audit did not run. See the log above."
               exit "$status" ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osv-report
          path: osv-report.md
          if-no-files-found: error

  # Docs are not built here, or on any schedule: generation is on-demand only
  # (`docs-on-demand.yml`, `workflow_dispatch`). A broken `@ref` is an error the test suite
  # cannot see (a docstring is only cross-referenced when it is rendered), so that check now
  # runs only when the on-demand workflow is dispatched, not on a weekly cadence.
