name: Julia DEV

# On-demand run of the `unit` test group against Julia 1.14, for finding out
# what the coming release does to Bramble. Nothing triggers it but `workflow_dispatch`, and nothing depends on
# it: it is not a gate and not part of the release procedure.
#
#   gh workflow run julia-nightly.yml -f os=macos-latest

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner
        type: choice
        default: macos-latest
        options: [macos-latest, ubuntu-latest]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia DEV - unit - ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          # `1.14` is the 1.14 release channel (a beta until 1.14.0 is out).
          version: "1.14"
          # 1.14 has only prereleases so far; without this setup-julia finds no match.
          include-all-prereleases: true

      # Each prerelease is a new build, and a compiled cache from another build is invalid anyway.
      - uses: julia-actions/cache@v3
        with:
          cache-compiled: "false"

      - uses: julia-actions/julia-buildpkg@v1

      # `--optimize=1`, as in CI.yml. Since Julia 1.14 the stdlib images for
      # `--check-bounds=yes` ship apart from Julia; julia-runtest (v1.13.0) installs them, so
      # the run does not start by precompiling every stdlib.
      - name: Run the tests
        uses: julia-actions/julia-runtest@v1
        with:
          optimize: "1"
          coverage: "false"
        env:
          BRAMBLE_TEST_GROUP: unit
          JULIA_NUM_THREADS: ${{ inputs.os == 'macos-latest' && 3 || 4 }}
