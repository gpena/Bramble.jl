<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff;
    --text: #2c2c2c;
    --muted: #6b6b6b;
    --border: #d8d8d4;
    --canvas-bg: #fafaf8;
    --accent: #0e7c86;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --text: #dcdcd6;
      --muted: #9a9a94;
      --border: #3a3a36;
      --canvas-bg: #262624;
      --accent: #4fd1c5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin-bottom: 12px;
  }
  .field { display: flex; flex-direction: column; gap: 2px; min-width: 120px; }
  .field.wide { min-width: 170px; }
  label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  select, input[type="range"] { font: inherit; color: var(--text); background: var(--canvas-bg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 4px; }
  input[type="range"] { padding: 0; accent-color: var(--accent); }
  .range-row { display: flex; align-items: center; gap: 8px; }
  .range-row span { font-variant-numeric: tabular-nums; min-width: 2.2em; }
  .canvases { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; }
  .panel { display: flex; flex-direction: column; gap: 4px; }
  .panel-title { font-size: 11px; color: var(--muted); }
  canvas { border: 1px solid var(--border); border-radius: 4px; background: var(--canvas-bg); display: block; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 2px 12px 2px 0; }
  th { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>

<div class="controls">
  <div class="field wide">
    <label for="nRange">Resolution N</label>
    <div class="range-row">
      <input type="range" id="nRange" min="8" max="48" step="1" value="24">
      <span id="nLabel">24</span>
    </div>
  </div>
  <div class="field">
    <label for="meshType">Mesh</label>
    <select id="meshType">
      <option value="uniform">Uniform</option>
      <option value="random" selected>Random</option>
    </select>
  </div>
  <div class="field wide">
    <label for="solutionSel">Manufactured solution</label>
    <select id="solutionSel">
      <option value="exp" selected>e^(x+y)</option>
      <option value="sine">sin(pi x) sin(pi y)</option>
      <option value="poly">(x^2-x)(y^2-y)</option>
    </select>
  </div>
  <div class="field">
    <label for="fieldView">Field</label>
    <select id="fieldView">
      <option value="solution" selected>u_h</option>
      <option value="error">|u_h - u|</option>
    </select>
  </div>
  <div class="field">
    <label for="panel2Sel">Panel 2</label>
    <select id="panel2Sel">
      <option value="spy" selected>Matrix sparsity</option>
      <option value="mesh">Mesh nodes</option>
    </select>
  </div>
  <div class="field">
    <label for="colormapSel">Colormap</label>
    <select id="colormapSel">
      <option value="viridis" selected>Viridis</option>
      <option value="plasma">Plasma</option>
      <option value="turbo">Turbo</option>
      <option value="gray">Grayscale</option>
    </select>
  </div>
</div>

<div class="canvases">
  <div class="panel">
    <span class="panel-title" id="fieldTitle">u_h(x, y)</span>
    <canvas id="fieldCanvas" width="260" height="260"></canvas>
  </div>
  <div class="panel">
    <span class="panel-title" id="panel2Title">Matrix sparsity</span>
    <canvas id="panel2Canvas" width="260" height="260"></canvas>
  </div>
</div>

<table id="diagTable">
  <tr><th>Degrees of freedom</th><td id="diagDof"></td>
      <th>Nonzeros</th><td id="diagNnz"></td></tr>
  <tr><th>norm&#x2095;(u&#x2095; - u)</th><td id="diagL2"></td>
      <th>norm&#x2081;&#x2095;(u&#x2095; - u)</th><td id="diagH1"></td></tr>
  <tr><th>Condition estimate &kappa;(A)</th><td id="diagCond" colspan="3"></td></tr>
</table>

<script>
(function () {
  "use strict";

  // Deterministic PRNG (mulberry32) so a given (N, mesh type) pair always draws the same
  // random mesh -- otherwise every slider tick would redraw a fresh random mesh and the
  // diagnostics table would jitter for reasons unrelated to the parameter being changed.
  function mulberry32(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Non-uniform tensor mesh on [0, 1]: interior nodes are independent uniform draws on
  // (0, 1), not a small jitter of a uniform partition, then sorted and floored on spacing
  // so no two nodes collapse onto each other.
  function buildAxis(N, random, seed) {
    var x = new Float64Array(N + 1);
    for (var i = 0; i <= N; i++) x[i] = i / N;
    if (!random) return x;

    var rand = mulberry32(seed);
    var h = 1 / N;
    for (i = 1; i < N; i++) x[i] = rand();
    x = Array.prototype.slice.call(x).sort(function (a, b) { return a - b; });

    var minGap = 0.15 * h;
    for (i = 1; i < N; i++) {
      if (x[i] - x[i - 1] < minGap) x[i] = x[i - 1] + minGap;
    }
    // Renormalise so the random interior still spans exactly to x[N] = 1.
    var span = x[N] === x[0] ? 1 : (1 - x[0]) / (x[N] - x[0]);
    for (i = 0; i <= N; i++) x[i] = x[0] + (x[i] - x[0]) * span;
    x[0] = 0;
    x[N] = 1;
    return Float64Array.from(x);
  }

  var SOLUTIONS = {
    exp: {
      label: "e^(x+y)",
      u: function (x, y) { return Math.exp(x + y); },
      g: function (x, y) { return -2 * Math.exp(x + y); },
    },
    sine: {
      label: "sin(pi x) sin(pi y)",
      u: function (x, y) { return Math.sin(Math.PI * x) * Math.sin(Math.PI * y); },
      g: function (x, y) { return 2 * Math.PI * Math.PI * Math.sin(Math.PI * x) * Math.sin(Math.PI * y); },
    },
    poly: {
      label: "(x^2-x)(y^2-y)",
      u: function (x, y) { return (x * x - x) * (y * y - y); },
      g: function (x, y) { return -2 * ((y * y - y) + (x * x - x)); },
    },
  };

  // Matrix-free 5-point finite-volume Laplacian on a non-uniform tensor mesh: the
  // coefficient a node assigns to a neighbour equals the coefficient that neighbour assigns
  // back (both are 1/(shared spacing)), so the operator is symmetric positive definite and
  // plain CG applies without a preconditioner needed for correctness.
  function assembleProblem(N, X, Y, solKey) {
    var sol = SOLUTIONS[solKey];
    var m = N - 1; // interior nodes per axis
    var dof = m * m;
    var idx = function (k, l) { return l * m + k; };

    var hxm = new Float64Array(m), hxp = new Float64Array(m);
    var hym = new Float64Array(m), hyp = new Float64Array(m);
    for (var k = 0; k < m; k++) { hxm[k] = X[k + 1] - X[k]; hxp[k] = X[k + 2] - X[k + 1]; }
    for (var l = 0; l < m; l++) { hym[l] = Y[l + 1] - Y[l]; hyp[l] = Y[l + 2] - Y[l + 1]; }

    var b = new Float64Array(dof);
    var nnzList = []; // [row, col] pairs, diagonal included, for the sparsity panel
    for (l = 0; l < m; l++) {
      for (k = 0; k < m; k++) {
        var ii = k + 1, jj = l + 1;
        // Flux coefficients weighted by the control volume's transverse face length: a
        // west/east flux is integrated over the cell's y-extent, a south/north flux over
        // its x-extent -- omitting this (bare 1/h) breaks the balance with the g*cellVol
        // right-hand side and silently scales the whole solution by ~h.
        var faceY = 0.5 * (hym[l] + hyp[l]), faceX = 0.5 * (hxm[k] + hxp[k]);
        var cW = faceY / hxm[k], cE = faceY / hxp[k], cS = faceX / hym[l], cN = faceX / hyp[l];
        var cellVol = faceX * faceY;
        var row = idx(k, l);
        var rhs = sol.g(X[ii], Y[jj]) * cellVol;

        if (k === 0) rhs += cW * sol.u(X[0], Y[jj]); else nnzList.push([row, idx(k - 1, l)]);
        if (k === m - 1) rhs += cE * sol.u(X[N], Y[jj]); else nnzList.push([row, idx(k + 1, l)]);
        if (l === 0) rhs += cS * sol.u(X[ii], Y[0]); else nnzList.push([row, idx(k, l - 1)]);
        if (l === m - 1) rhs += cN * sol.u(X[ii], Y[N]); else nnzList.push([row, idx(k, l + 1)]);
        nnzList.push([row, row]);

        b[row] = rhs;
      }
    }

    function matvec(v, out) {
      for (var l2 = 0; l2 < m; l2++) {
        for (var k2 = 0; k2 < m; k2++) {
          var faceY2 = 0.5 * (hym[l2] + hyp[l2]), faceX2 = 0.5 * (hxm[k2] + hxp[k2]);
          var cW2 = faceY2 / hxm[k2], cE2 = faceY2 / hxp[k2], cS2 = faceX2 / hym[l2], cN2 = faceX2 / hyp[l2];
          var r = idx(k2, l2);
          var s = (cW2 + cE2 + cS2 + cN2) * v[r];
          if (k2 > 0) s -= cW2 * v[idx(k2 - 1, l2)];
          if (k2 < m - 1) s -= cE2 * v[idx(k2 + 1, l2)];
          if (l2 > 0) s -= cS2 * v[idx(k2, l2 - 1)];
          if (l2 < m - 1) s -= cN2 * v[idx(k2, l2 + 1)];
          out[r] = s;
        }
      }
    }

    return { dof: dof, b: b, matvec: matvec, nnz: nnzList, sol: sol, m: m };
  }

  function dot(a, b) {
    var s = 0;
    for (var i = 0; i < a.length; i++) s += a[i] * b[i];
    return s;
  }

  // Plain conjugate gradient on the matrix-free operator. Returns the solution together
  // with every alpha/beta scalar, which is all the Lanczos-CG connection needs to estimate
  // the extreme eigenvalues of A without ever forming or storing it.
  function conjugateGradient(dof, matvec, b) {
    var x = new Float64Array(dof);
    var r = b.slice();
    var p = r.slice();
    var Ap = new Float64Array(dof);
    var rho = dot(r, r);
    var rho0 = rho || 1;
    var alphas = [], betas = [];
    var maxIter = Math.min(3 * dof, 2000);

    for (var iter = 0; iter < maxIter && rho / rho0 > 1e-20; iter++) {
      matvec(p, Ap);
      var alpha = rho / dot(p, Ap);
      for (var i = 0; i < dof; i++) { x[i] += alpha * p[i]; r[i] -= alpha * Ap[i]; }
      var rhoNext = dot(r, r);
      alphas.push(alpha);
      if (rhoNext / rho0 <= 1e-20) { rho = rhoNext; break; }
      var beta = rhoNext / rho;
      betas.push(beta);
      for (i = 0; i < dof; i++) p[i] = r[i] + beta * p[i];
      rho = rhoNext;
    }
    return { x: x, alphas: alphas, betas: betas };
  }

  // Meurant's Lanczos/CG correspondence: the CG scalars are exactly the entries of the
  // tridiagonal matrix the Lanczos process would have produced on A, so its extreme
  // eigenvalues -- found here by Sturm-sequence bisection, no full eigendecomposition --
  // estimate the extreme eigenvalues of A itself.
  function conditionEstimate(alphas, betas) {
    var mIter = alphas.length;
    if (mIter < 2) return 1;
    var delta = new Float64Array(mIter), gamma = new Float64Array(mIter - 1);
    delta[0] = 1 / alphas[0];
    for (var k = 1; k < mIter; k++) delta[k] = 1 / alphas[k] + betas[k - 1] / alphas[k - 1];
    for (k = 0; k < mIter - 1; k++) gamma[k] = Math.sqrt(betas[k]) / alphas[k];

    function sturmCount(x) {
      var q = delta[0] - x;
      var count = q < 0 ? 1 : 0;
      for (var i = 1; i < mIter; i++) {
        q = (delta[i] - x) - (gamma[i - 1] * gamma[i - 1]) / (q === 0 ? 1e-300 : q);
        if (q < 0) count++;
      }
      return count;
    }

    var radius = 0;
    for (k = 0; k < mIter; k++) {
      var r = Math.abs(delta[k]) + (k > 0 ? Math.abs(gamma[k - 1]) : 0) + (k < mIter - 1 ? Math.abs(gamma[k]) : 0);
      radius = Math.max(radius, r);
    }

    function findEigenvalue(targetCount) {
      var lo = -radius, hi = radius;
      for (var it = 0; it < 60; it++) {
        var mid = 0.5 * (lo + hi);
        if (sturmCount(mid) < targetCount) lo = mid; else hi = mid;
      }
      return hi;
    }

    var lambdaMin = findEigenvalue(1);
    var lambdaMax = findEigenvalue(mIter);
    return lambdaMax / lambdaMin;
  }

  var COLORMAPS = {
    viridis: ["#440154", "#414487", "#2a788e", "#22a884", "#7ad151", "#fde725"],
    plasma: ["#0d0887", "#6a00a8", "#b12a90", "#e16462", "#fca636", "#f0f921"],
    turbo: ["#30123b", "#4147d6", "#1ba8c9", "#61c93a", "#ecd21a", "#e4460a", "#7a0403"],
    gray: ["#000000", "#ffffff"],
  };
  function hexToRgb(h) {
    var v = parseInt(h.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  function colormapFn(name) {
    var stops = COLORMAPS[name].map(hexToRgb);
    return function (t) {
      t = Math.max(0, Math.min(1, t));
      var pos = t * (stops.length - 1);
      var i0 = Math.floor(pos), i1 = Math.min(i0 + 1, stops.length - 1);
      var f = pos - i0, a = stops[i0], b = stops[i1];
      return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
    };
  }

  function drawField(canvas, N, X, Y, values, cmap) {
    var ctx = canvas.getContext("2d");
    var min = Infinity, max = -Infinity;
    for (var i = 0; i < values.length; i++) { if (values[i] < min) min = values[i]; if (values[i] > max) max = values[i]; }
    var range = max - min || 1;

    var off = document.createElement("canvas");
    off.width = N + 1; off.height = N + 1;
    var octx = off.getContext("2d");
    var img = octx.createImageData(N + 1, N + 1);
    for (var j = 0; j <= N; j++) {
      var srcRow = N - j; // flip so y increases upward
      for (i = 0; i <= N; i++) {
        var t = (values[srcRow * (N + 1) + i] - min) / range;
        var rgb = cmap(t);
        var p = (j * (N + 1) + i) * 4;
        img.data[p] = rgb[0]; img.data[p + 1] = rgb[1]; img.data[p + 2] = rgb[2]; img.data[p + 3] = 255;
      }
    }
    octx.putImageData(img, 0, 0);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
    return [min, max];
  }

  function drawSpy(canvas, dof, nnzList) {
    var ctx = canvas.getContext("2d");
    var bg = getComputedStyle(canvas).backgroundColor;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    var scale = canvas.width / dof;
    var dot = Math.max(1, Math.ceil(scale));
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent") || "#0e7c86";
    for (var n = 0; n < nnzList.length; n++) {
      var row = nnzList[n][0], col = nnzList[n][1];
      ctx.fillRect(Math.floor(col * scale), Math.floor(row * scale), dot, dot);
    }
  }

  function drawMeshNodes(canvas, X, Y) {
    var ctx = canvas.getContext("2d");
    var bg = getComputedStyle(canvas).backgroundColor;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    var margin = 14;
    var w = canvas.width - 2 * margin, h = canvas.height - 2 * margin;
    var toPx = function (x) { return margin + x * w; };
    var toPy = function (y) { return canvas.height - margin - y * h; };

    ctx.strokeStyle = getComputedStyle(canvas).borderColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 0; i < X.length; i++) {
      ctx.moveTo(toPx(X[i]), toPy(Y[0]));
      ctx.lineTo(toPx(X[i]), toPy(Y[Y.length - 1]));
    }
    for (var j = 0; j < Y.length; j++) {
      ctx.moveTo(toPx(X[0]), toPy(Y[j]));
      ctx.lineTo(toPx(X[X.length - 1]), toPy(Y[j]));
    }
    ctx.stroke();

    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent") || "#0e7c86";
    for (i = 0; i < X.length; i++) {
      for (j = 0; j < Y.length; j++) {
        ctx.beginPath();
        ctx.arc(toPx(X[i]), toPy(Y[j]), 1.6, 0, 2 * Math.PI);
        ctx.fill();
      }
    }
  }

  // Bramble's own normₕ and norm₁ₕ (src/space/inner_product.jl), not an independently
  // chosen discretization: normₕ weights each node by its cell measure (nodal trapezoid
  // weight -- half the sum of the two adjacent spacings, half-spacing at the boundary,
  // exactly `half_spacing`/`cell_measure` in scalar_gridspace.jl); norm₁ₕ is
  // sqrt(normₕ^2 + seminorm^2), the seminorm summing the backward-difference quotient
  // along each direction weighted by that direction's spacing times the transverse cell
  // measure -- which multiplies out to the transverse cell measure times (Δu)^2/h, the
  // form used directly below.
  function nodalWeights(Z) {
    var N = Z.length - 1;
    var w = new Float64Array(N + 1);
    w[0] = (Z[1] - Z[0]) / 2;
    w[N] = (Z[N] - Z[N - 1]) / 2;
    for (var i = 1; i < N; i++) w[i] = (Z[i + 1] - Z[i - 1]) / 2;
    return w;
  }

  function computeErrors(N, X, Y, uGrid, sol) {
    var wx = nodalWeights(X), wy = nodalWeights(Y);
    var normhSq = 0;
    var errGrid = new Float64Array((N + 1) * (N + 1));
    for (var j = 0; j <= N; j++) {
      for (var i = 0; i <= N; i++) {
        var e = uGrid[j * (N + 1) + i] - sol.u(X[i], Y[j]);
        errGrid[j * (N + 1) + i] = e;
        normhSq += wx[i] * wy[j] * e * e;
      }
    }
    var seminormSq = 0;
    for (j = 0; j <= N; j++) {
      for (i = 0; i < N; i++) {
        var dx = X[i + 1] - X[i];
        var de = errGrid[j * (N + 1) + i + 1] - errGrid[j * (N + 1) + i];
        seminormSq += wy[j] * (de / dx) * (de / dx) * dx;
      }
    }
    for (j = 0; j < N; j++) {
      var dy = Y[j + 1] - Y[j];
      for (i = 0; i <= N; i++) {
        var de2 = errGrid[(j + 1) * (N + 1) + i] - errGrid[j * (N + 1) + i];
        seminormSq += wx[i] * (de2 / dy) * (de2 / dy) * dy;
      }
    }
    return { normh: Math.sqrt(normhSq), norm1h: Math.sqrt(normhSq + seminormSq), errGrid: errGrid };
  }

  function fmt(x) {
    if (!isFinite(x)) return "--";
    return x.toExponential(3);
  }

  function recompute() {
    var N = parseInt(document.getElementById("nRange").value, 10);
    document.getElementById("nLabel").textContent = N;
    var random = document.getElementById("meshType").value === "random";
    var solKey = document.getElementById("solutionSel").value;
    var fieldView = document.getElementById("fieldView").value;
    var panel2 = document.getElementById("panel2Sel").value;
    var cmap = colormapFn(document.getElementById("colormapSel").value);

    // Seed depends on N: without it, every resolution would replay the same PRNG prefix
    // (the first draws of one fixed sequence), so scrubbing the slider would just add
    // points to an already-fixed pattern instead of drawing a genuinely different mesh.
    var X = buildAxis(N, random, 20260916 + N * 7919);
    var Y = buildAxis(N, random, 20260917 + N * 7919);
    var problem = assembleProblem(N, X, Y, solKey);
    var cg = conjugateGradient(problem.dof, problem.matvec, problem.b);
    var kappa = conditionEstimate(cg.alphas, cg.betas);

    var m = problem.m;
    var uGrid = new Float64Array((N + 1) * (N + 1));
    for (var j = 0; j <= N; j++) {
      for (var i = 0; i <= N; i++) {
        var interior = i > 0 && i < N && j > 0 && j < N;
        uGrid[j * (N + 1) + i] = interior ? cg.x[(j - 1) * m + (i - 1)] : problem.sol.u(X[i], Y[j]);
      }
    }

    var errors = computeErrors(N, X, Y, uGrid, problem.sol);
    var displayed = fieldView === "solution" ? uGrid : errors.errGrid.map(Math.abs);

    document.getElementById("fieldTitle").textContent = fieldView === "solution" ? "u_h(x, y)" : "|u_h - u|(x, y)";
    drawField(document.getElementById("fieldCanvas"), N, X, Y, displayed, cmap);

    document.getElementById("panel2Title").textContent = panel2 === "spy" ? "Matrix sparsity" : "Mesh nodes";
    if (panel2 === "spy") drawSpy(document.getElementById("panel2Canvas"), problem.dof, problem.nnz);
    else drawMeshNodes(document.getElementById("panel2Canvas"), X, Y);

    document.getElementById("diagDof").textContent = problem.dof;
    document.getElementById("diagNnz").textContent = problem.nnz.length;
    document.getElementById("diagL2").textContent = fmt(errors.normh);
    document.getElementById("diagH1").textContent = fmt(errors.norm1h);
    document.getElementById("diagCond").textContent = fmt(kappa);
  }

  ["nRange", "meshType", "solutionSel", "fieldView", "panel2Sel", "colormapSel"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", recompute);
  });

  if (window.__BRAMBLE_INITIAL_N__) document.getElementById("nRange").value = window.__BRAMBLE_INITIAL_N__;
  recompute();
})();
</script>
</body>
</html>
