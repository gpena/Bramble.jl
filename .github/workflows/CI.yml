name: CI

# The fast gate: only the Julia version matrix that actually tests Bramble's code, on macOS
# only. Spelling, formatting, quality (Aqua & JET), the docs build/deploy, coverage upload,
# and Linux itself all moved to nightly.yml, once a day — see the comment there for why.

permissions:
  contents: read
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_NUM_THREADS: auto

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'Project.toml'
              - '.github/workflows/CI.yml'
              - 'codecov.yml'
              - '_typos.toml'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The 1.13 pre-release is a canary, not a gate: what it catches is a future Julia
    # changing under us, which is worth learning about without blocking the branch. `1.12`
    # is the only version whose failure means Bramble is broken. Promote `~1.13.0-0` out of
    # this when it goes final. `nightly`, and Linux itself, moved to the daily-scheduled
    # nightly.yml — Linux specifically because a Linux-only allocation flake in `avgₕ!`
    # (an architecture-dependent `@generated` fold, not a real regression each time it
    # shows up) meant a red gate on an unrelated PR too often to be worth blocking on.
    continue-on-error: ${{ matrix.version != '1.12' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ["1.12", "~1.13.0-0"]
        os: [macOS-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          BRAMBLE_TEST_GROUP: unit
