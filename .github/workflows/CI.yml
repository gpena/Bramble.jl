name: CI

# The fast gate: only the Julia version matrix that actually tests Bramble's code, on macOS
# only. Formatting, quality (Aqua & JET), the docs build/deploy, coverage upload,
# and Linux itself all moved to nightly.yml, once a day — see the comment there for why.

permissions:
  contents: read
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_NUM_THREADS: auto

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'Project.toml'
              - '.github/workflows/CI.yml'
              - 'codecov.yml'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # One version, and it gates: 1.13, current release since 2026-09-10, is the Julia a
    # push has to pass on. It replaced the `~1.13.0-0` canary leg that sat here while
    # 1.13 was in prerelease, allowed to fail.
    #
    # The 1.12 floor that Project.toml still declares moved to the daily-scheduled
    # nightly.yml, next to `nightly` and Linux — Linux specifically because a Linux-only
    # allocation flake in `avgₕ!` (an architecture-dependent `@generated` fold, not a real
    # regression each time it shows up) meant a red gate on an unrelated PR too often to be
    # worth blocking on. The trade: a break that only 1.12 sees is now caught the same day
    # rather than the same push. It still fails nightly.yml when it happens.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Spelled `1.13`, not `1` and not `~1.13.0-0`: `1` would roll onto 1.14 the day
        # it is released and gate pushes on a Julia nobody here has run yet, and the
        # range would pick up a `1.13.1-rc1` prerelease as soon as one is published.
        # `1.13` tracks released 1.13.x and nothing else.
        version: ["1.13"]
        os: [macOS-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          BRAMBLE_TEST_GROUP: unit
