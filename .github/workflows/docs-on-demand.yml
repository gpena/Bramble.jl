name: Docs (on demand)

# A standalone trigger for exactly one thing: rebuild and redeploy the documentation site
# right now, rather than waiting for Nightly.yml's own docs job to run on its 06:00 UTC
# schedule (or the rest of that workflow's full test matrix along with it). Same steps as
# Nightly.yml's `docs` job, factored out here rather than shared, since a push to `main`
# is exactly the moment this is wanted and Nightly.yml's own schedule already covers the
# routine case — this is for "I just pushed a docs fix and don't want to wait until
# tomorrow," not a replacement for the nightly job.
#
# Julia 1.13, the same release every other docs job now builds on. That used to be the
# difference between this workflow and Nightly.yml's docs job, which built on Julia
# nightly; both are on the release since 1.13 went final, so keep the two in step when
# either moves.

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --color=yes --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'

      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --color=yes --project=docs docs/make.jl
