name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_NUM_THREADS: auto

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'Project.toml'
              - '.github/workflows/CI.yml'
              - 'codecov.yml'
              - '_typos.toml'
            docs:
              - 'docs/**'
              - 'src/**'
              - 'Project.toml'
              - '*.md'

  spelling:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.49.0

  test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # nightly and the 1.13 pre-release are canaries, not gates: what they catch is a future
    # Julia changing under us, which is worth learning about without blocking the branch.
    # `1.12` is the only version whose failure means Bramble is broken. Promote
    # `~1.13.0-0` out of this when it goes final.
    continue-on-error: ${{ matrix.version != '1.12' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        version: ["1.12", "~1.13.0-0", "nightly"]
        os: [ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"
      - uses: julia-actions/julia-buildpkg@v1
      # Coverage is collected on one job only: the release version on Linux.
      #
      # `julia-runtest` instruments by default, so this used to be all six. That was
      # redundant — the line data is the same whichever Julia or OS produced it, so five of
      # the six uploads told Codecov what the sixth already had — and it made every job pay
      # the instrumentation.
      #
      # It also broke the branch. `CoverageTools.process_cov` reads a `.cov` line by taking
      # `line[1:9]` as the hit count, which throws `BoundsError: attempt to access empty
      # String at index [1:9]` as soon as a line comes back empty. That happened on
      # 1.13.0-0 on macOS while processing `src/form/linear.jl.cov` — inside the action,
      # not in Bramble — and the pre-release was gating at the time, so a third-party
      # parser's assumption failed the build.
      #
      # What this gives up: the allocation assertions no longer run under coverage anywhere
      # but here. They run either way — `test/runtests.jl` stopped skipping them under
      # instrumentation on purpose — so what is lost is only the chance of a *pre-release*
      # Julia revealing that it accounts for allocations differently under coverage. The
      # release job still checks that, which is where it matters.
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.version == '1.12' && matrix.os == 'ubuntu-latest' }}
        env:
          BRAMBLE_TEST_GROUP: unit

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v5
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true
          fail_ci_if_error: false

  quality:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Quality (Aqua & JET)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
        with:
          cache-compiled: "true"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          BRAMBLE_TEST_GROUP: quality

  format:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Check SciML style
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate(mktempdir())
            Pkg.add("JuliaFormatter")
            using JuliaFormatter
            format(["src", "test"]; overwrite = false) && exit(0)
            @error "Source is not SciML formatted. Run JuliaFormatter over src and test."
            exit(1)'

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: "nightly"
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: |
          julia --color=yes --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --color=yes --project=docs docs/make.jl
